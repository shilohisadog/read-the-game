# Publish src/ to Cloudflare Pages.
#
# WHY FROM CI AND NOT A LAPTOP. Wrangler requires Node >= 22 and the development
# machine runs 20, so a local deploy would mean upgrading the runtime the test
# suite is pinned against in order to ship a static folder. It would also put a
# Cloudflare credential on a laptop. Here the token never leaves GitHub, and the
# deploy always runs from a clean checkout -- so only committed files can be
# published. Nothing untracked or gitignored can reach the public site by
# accident, which has happened once already (builders/build_rules.py, f4a2c67).
#
# THE GATES RUN BEFORE THE DEPLOY, IN THIS JOB. gates.yml proves the commit is
# sound, but a separate workflow is a separate run: relying on it would mean
# publishing on the assumption that the other job passed. The check that guards
# a deploy has to be the deploy's own.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one midway -- a half-finished upload
# to a live site is worse than a queued one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  PROJECT: read-the-game
  WRANGLER: wrangler@4.120.0   # pinned: "whatever npx resolved to today" is not a build
  # The hostnames people actually visit. Verifying only <project>.pages.dev
  # would leave the gate proving a URL nobody uses, and a custom domain can
  # come detached -- the binding lives in Cloudflare, not in this repo.
  PUBLIC_HOSTS: readthegame.co www.readthegame.co read-the-game.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: gates
        run: npm run gates

      # A generated file that differs from what its builder produces means the
      # HTML was hand-edited. Shipping that publishes something no builder can
      # reproduce, and the next build silently reverts it.
      - name: the working tree must be unchanged by a build
        run: git diff --exit-code

      # The pages that inline their whole game must still call nobody. This grep
      # is a blacklist over an open vocabulary and cannot close -- it is blind to
      # import(), EventSource, sendBeacon and window["fetch"] -- so it is a
      # backstop, not the guarantee. index.html is exempt because it legitimately
      # fetches its own freshness, and its guarantee is a CSP the browser
      # enforces, checked in the step below.
      - name: the inlined pages must not call out to anything
        run: |
          # index.html fetches its own freshness and game.html fetches its game;
          # both are exempt here and both carry a hash-pinned CSP the BROWSER
          # enforces, which is a stronger promise than this grep can make. The
          # grep stays for the pages that genuinely reach nothing.
          pages=$(ls src/*.html | grep -vE 'src/(index|game)\.html')
          if grep -rniE 'fetch\(|XMLHttpRequest|new WebSocket|src="https?:|<link[^>]+https?:' $pages; then
            echo "::error::a shipped page references the network"
            exit 1
          fi
          echo "no outbound calls in $(echo "$pages" | wc -l) inlined pages"

      # THE CSP MUST EXECUTE, NOT MERELY BE PRESENT. A hash-pinned policy with a
      # stale hash is a blank page that passes every grep we could write, so the
      # only honest check is a real browser. This runs pre-deploy over file://
      # and proves the script is PERMITTED TO RUN by the policy.
      #
      # It does NOT prove the page works, and the difference cost us: over
      # file:// the fetch fails for its own reasons, so this passed while every
      # real visitor would have seen "No data loaded yet" -- R2 was sending no
      # Access-Control-Allow-Origin and the browser was discarding a response
      # that was public, reachable and correct. curl does not apply CORS, so
      # nothing else we had could see it either. The live check after the deploy
      # is the one that closes that gap.
      - name: the index is permitted to run under its own CSP
        run: |
          command -v google-chrome >/dev/null || { echo "::error::no Chrome on this runner"; exit 1; }
          before=$(grep -o 'id="state"[^>]*>[^<]*' src/index.html)
          # --enable-logging=stderr --log-level=0 OR THE GREP BELOW IS BLIND.
          # Without them Chrome writes dbus noise to stderr and NOTHING ELSE:
          # console messages, including every CSP refusal, are simply not routed
          # there. This grep could not match, and had never matched, in the whole
          # time it has been described as a check. It was found by the canary in
          # the policy-refusal step at the foot of this file, which is the entire
          # argument for canaries.
          #
          # The OTHER assertion here — that the placeholder changed — is real and
          # is what has actually been proving the script may run.
          google-chrome --headless --no-sandbox --disable-gpu \
            --enable-logging=stderr --log-level=0 \
            --virtual-time-budget=8000 --dump-dom \
            "file://$PWD/src/index.html" > rendered.html 2> chrome.log || true
          after=$(grep -o 'id="state"[^>]*>[^<]*' rendered.html || true)
          echo "  placeholder: $before"
          echo "  rendered   : $after"
          if grep -qi 'Content Security Policy\|Refused to execute\|Refused to load' chrome.log; then
            echo "::error::the browser refused something under our own CSP"
            grep -i 'refused\|Content Security Policy' chrome.log | head -5
            exit 1
          fi
          [ "$after" != "$before" ] || { echo "::error::the script never ran"; exit 1; }
          echo "  the script is permitted by the policy"

      # WHAT A LAYER DRAWS, checked in an engine that has a stylesheet.
      #
      # test/render.test.js boots the same bundle against a fake document and
      # covers the markup: that marks appear only when the layer is on, that the
      # sentence and its provenance are written, that trails do what they say. It
      # is deliberately not repeated here. What that test STRUCTURALLY CANNOT SEE
      # is CSS. Two claims live only there, and this step exists for exactly those
      # two rather than re-asserting the cheap half:
      #
      #   the whistle panel is REVEALED by a stylesheet rule, so a fake document
      #   calling it "rendered" cannot tell you a visitor sees it;
      #
      #   and which team's mark is white. The markup says only `class="att a"`
      #   and `class="att h"` -- the sweater convention is entirely a stylesheet
      #   decision, and it is the only thing separating two clubs that wear the
      #   same hex.
      #
      # Conditions imposed, not requested, as with the phone gate: the probe
      # clicks the real button and measures the real box.
      #
      # read-the-game.html, because it carries its game inside it: no network, no
      # CORS, no catalog. Served over http rather than file:// so the probe may
      # reach into the frame.
      - name: what only a stylesheet can settle
        run: |
          mkdir -p ice && cp src/read-the-game.html ice/app.html && cd ice
          cat > probe.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>pending</title></head>
          <body style="margin:0">
          <iframe id="f" src="app.html" style="width:1100px;height:900px;border:0"></iframe>
          <script>
          setTimeout(function () {
            var d = document.getElementById('f').contentDocument;
            var p = d.getElementById('whistlePanel');
            /* Height of the box as laid out, which is the number no fake document
               can produce. Zero means the stylesheet is hiding it, however
               correct the markup inside it is. */
            var h = function () { return Math.round(p.getBoundingClientRect().height); };
            var shut = h();
            d.getElementById('lyWhistle').click();
            /* Sweep rather than pick a moment. A whistle is placed by the faceoff
               that restarts play, so any single frame is entitled to hold none --
               a fixed 70%-through index would make this gate's colour depend on
               which event the reference game happens to have there. */
            var s = d.getElementById('scrub'), open = 0, rings = 0, text = 0;
            for (var k = 1; k <= 20; k++) {
              s.value = Math.round(+s.max * k / 20);
              s.dispatchEvent(new Event('input'));
              open = Math.max(open, h());
              rings = Math.max(rings, d.getElementById('whistles').querySelectorAll('circle').length);
              text = Math.max(text, (p.textContent || '').trim().length);
            }
            /* THE SWEATER CONVENTION, in the only place it is real. The markup
               says only class="att a" and class="att h"; which of them ends up
               white is decided entirely by the stylesheet, so a fake document
               cannot check it and this is the one engine that can. Trails on, so
               both teams have marks in the same frame. */
            d.querySelector('#rg .tbtn[data-t="all"]').click();
            s.value = Math.round(+s.max * 0.55);
            s.dispatchEvent(new Event('input'));
            var paint = function (sel) {
              var n = d.querySelector('#rg #events ' + sel);
              if (!n) return 'absent';
              var c = getComputedStyle(n);
              return (c.fill + '|' + c.stroke).replace(/ /g, '');
            };
            document.title = 'ICE ' + shut + ' ' + open + ' ' + rings + ' ' + text
                           + ' VIS ' + paint('.att.a') + ' HOST ' + paint('.att.h');
          }, 4000);
          </script>
          </body></html>
          HTML
          python3 -m http.server 8098 >/dev/null 2>&1 &
          sleep 2
          dom=$(google-chrome --headless --no-sandbox --disable-gpu \
                  --virtual-time-budget=25000 --dump-dom \
                  "http://localhost:8098/probe.html" 2>/dev/null)
          read -r _ shut open rings text _ vis _ host \
            <<<"$(echo "$dom" | grep -o 'ICE [0-9 ]* VIS [^ ]* HOST [^ <]*' | head -1)"
          if [ -z "$text" ]; then
            echo "::error::the probe never reported — the app did not run in the frame"
            echo "$dom" | head -20; exit 1
          fi
          echo "  layer off: the panel is ${shut}px tall"
          echo "  layer on : the panel is ${open}px tall, holding $text characters"
          echo "             and $rings whistle marks are on the ice"
          fail=0
          # THE PAIR IS THE POINT. A panel that is always visible passes the
          # second check alone, and a stylesheet that hides it always passes the
          # first alone. Neither is worth anything without the other.
          [ "$shut" -eq 0 ] || { echo "::error::the panel is on screen with the layer OFF (${shut}px)"; fail=1; }
          [ "$open" -gt 20 ] || { echo "::error::the layer is on and the panel is ${open}px tall — the CSS is hiding it"; fail=1; }
          [ "$text" -ge 40 ] || { echo "::error::the panel is visible and explains nothing ($text chars)"; fail=1; }
          [ "$rings" -ge 1 ] || { echo "::error::no whistle mark reached the ice in a real browser"; fail=1; }

          # The visitor wears white and the host wears its colour. Asserted as a
          # PAIR: "the visitor is white" is also satisfied by a page that paints
          # everything white, which is the same defect being fixed -- both teams
          # the same colour.
          echo "  visitor mark: $vis"
          echo "  host mark   : $host"
          case "$vis" in
            rgb'(255,255,255)'*) ;;
            absent*) echo "::error::no visitor mark was drawn, so nothing was checked"; fail=1 ;;
            *) echo "::error::the visitor mark is painted $vis, not white — the sweater"
               echo "  convention is not reaching the ice, and the five matchups whose"
               echo "  clubs share a hex (FLA/WSH, DET/NJD, BOS/NSH, EDM/WPG, TOR/VAN)"
               echo "  would render as one colour"
               fail=1 ;;
          esac
          if [ "$vis" = "$host" ]; then
            echo "::error::both teams are painted identically ($vis) — the page cannot"
            echo "  tell them apart, which is the defect this convention exists to fix"
            fail=1
          fi
          exit $fail

      - name: ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creating an existing project is an error, so ask first rather than
          # swallowing failures with `|| true` -- that would also hide a bad
          # token, and the deploy would fail later with a confusing message.
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            echo "project $PROJECT already exists"
          else
            echo "creating project $PROJECT"
            npx --yes "$WRANGLER" pages project create "$PROJECT" \
              --production-branch main
          fi

      - name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy src \
            --project-name "$PROJECT" \
            --branch main \
            --commit-dirty=true | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

      # Deploying and assuming it worked is not verification. Fetch every page
      # back over the public internet and compare it byte for byte against the
      # file in this checkout -- 200 OK only proves something answered, not that
      # what is public is what we committed.
      #
      # RETRY EVERY PAGE, NOT JUST THE FIRST. A brand-new *.pages.dev hostname
      # takes roughly 40 seconds to come up and answers 522 until it does. The
      # first version of this step retried the root and then checked the other
      # pages once each, so the root spent six attempts waiting out propagation
      # and the very next request failed on the tail of the same cold start.
      # The deploy was fine; the check was shaped wrong.
      #
      # DIFF AGAINST THE DEPLOYMENT URL, NOT THE PRODUCTION HOSTNAME. Pages
      # gives every deployment its own immutable <hash>.<project>.pages.dev,
      # which is the artifact just uploaded with nothing aliased or cached in
      # front of it. The production hostname is a moving pointer with an edge
      # cache, and it served the previous build for minutes after a correct
      # deploy -- `?cb=1` on the same URL returned the new bytes, so the alias
      # had switched and only the cached object was stale. Diffing there tests
      # Cloudflare's cache invalidation, which is not our invariant. Production
      # is checked separately, for reachability, with the cache defeated.
      - name: fetch the live site back and diff it against the repo
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::no deployment URL was captured from wrangler — cannot verify"
            exit 1
          fi
          URL="$DEPLOY_URL"
          echo "checking $URL"

          # Retries on 5xx (edge not ready) but NOT on 404 -- a missing file is
          # a real answer, and waiting 60s to report it just hides the cause.
          fetch() {  # fetch <path> <destination>
            local path="$1" dest="$2" code
            for i in $(seq 1 12); do
              # 000 is curl's code for a transport failure, which for a hostname
              # minutes old usually means DNS has not propagated yet -- another
              # thing to wait out rather than report as a broken site.
              code=$(curl -sS -o "$dest" -w '%{http_code}' -L "$URL/$path") || code=000
              case "$code" in
                200)     return 0 ;;
                5*|000)  echo "    attempt $i: HTTP $code — edge not ready"; sleep 6 ;;
                *)       echo "::error::/$path returned HTTP $code"; return 1 ;;
              esac
            done
            echo "::error::/$path never became available (last HTTP $code)"
            return 1
          }

          # The root is its own case: it is not a file we deploy but a route
          # Pages resolves to index.html, and getting that wrong is a 404 on
          # the front page with every deep link still working.
          fetch "" root.html
          if ! cmp -s root.html src/index.html; then
            echo "::error::the site root is not src/index.html"
            exit 1
          fi
          echo "  /  ->  index.html  ($(wc -c < root.html) bytes, identical)"

          fail=0
          for f in src/*.html; do
            page=$(basename "$f")
            fetch "$page" live.html || { fail=1; continue; }
            if cmp -s live.html "$f"; then
              echo "  /$page  ($(wc -c < "$f") bytes, identical)"
            else
              echo "::error::/$page differs from $f — published bytes are not committed bytes"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "all $(ls src/*.html | wc -l) pages match the checkout byte for byte"

          # Production is a separate question: does each public hostname resolve
          # to this deployment at all?
          #
          # RETRY THE COMPARISON, NOT ONLY THE STATUS. The fetch helper retries
          # 5xx and 000 -- "not ready yet" -- but a hostname that has just been
          # deployed to can be perfectly ready and briefly serve the PREVIOUS
          # bytes with a 200. That is what happened on the first run of this
          # check: readthegame.co is tested first, seconds after the upload, and
          # failed while www and pages.dev, tested moments later, passed. The
          # deploy was correct and the site was correct within seconds.
          #
          # So a mismatch is not immediately a failure; it is "propagating"
          # until it has been given a bounded amount of time to stop being one.
          # A cache-busting query defeats the edge cache but cannot hurry the
          # alias itself.
          echo
          for host in $PUBLIC_HOSTS; do
            URL="https://${host}"
            matched=0
            for i in $(seq 1 10); do
              if fetch "?cb=${GITHUB_RUN_ID}-${i}" prod.html && cmp -s prod.html src/index.html; then
                matched=1; break
              fi
              echo "    $host: serving a different build — attempt $i, waiting"
              sleep 6
            done
            if [ "$matched" = 1 ]; then
              echo "  https://${host} serves the current index"
            else
              echo "::error::https://${host} never served this deployment"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # THE CHECK THAT WOULD HAVE CAUGHT THE CORS BUG. Everything above proves
      # the bytes we published are the bytes we committed; none of it proves a
      # BROWSER can use them. Load the live site as a visitor does and require
      # the freshness line to say something real -- "No data loaded yet" on a
      # site holding games means the data could not be read, whatever the reason.
      - name: a visitor can actually read the data
        run: |
          fail=0
          for i in $(seq 1 8); do
            google-chrome --headless --no-sandbox --disable-gpu \
              --virtual-time-budget=15000 --dump-dom \
              "https://readthegame.co/?cb=${GITHUB_RUN_ID}-${i}" > live.html 2>/dev/null || true
            state=$(grep -o 'id="state"[^>]*>[^<]*' live.html | sed 's/.*>//' || true)
            case "$state" in
              *"Data through"*) echo "  the live site reports: $state"; fail=0; break ;;
              "") echo "    attempt $i: page not rendered yet"; fail=1 ;;
              *) echo "    attempt $i: \"$state\""; fail=1 ;;
            esac
            sleep 8
          done
          if [ "$fail" != 0 ]; then
            echo "::error::a visitor cannot read the data — last state: \"$state\""
            echo "  if this says 'No data loaded yet', check the R2 CORS policy (r2-cors workflow)"
            exit 1
          fi

      # THE SHELL IS THE PAGE A LINK POINTS AT, so it is the page a stranger
      # meets first — and the only one that fetches a GAME rather than a
      # freshness line. Everything above proves the bytes are ours; this proves
      # a browser can turn them into hockey. The CORS bug is why it is a real
      # browser against the live origin: curl cannot see a CORS failure and a
      # file:// render fails for its own reasons.
      #
      # WAIT FOR THE CURRENT BUILD FIRST. The first version of this step did
      # not, and gave a FALSE GREEN on its own first run: production was still
      # serving the previous game.html, the browser rendered YESTERDAY'S page,
      # and the check passed while displaying a date belonging to another game.
      # The byte-diff step already knows a production hostname briefly answers
      # 200 with the old build — this step has to know it too, or it is testing
      # a page nobody just deployed.
      # THE PAGES FIT A PHONE, MEASURED IN A BROWSER.
      #
      # Eight of nine pages shipped with no viewport meta, so a phone laid them
      # out at ~980px and scaled the result down until the text was unreadable.
      # NOTHING FAILED -- every test passed, every page rendered, and the only
      # symptom was on a device the author was not using.
      #
      # THE FIRST VERSION OF THIS STEP WAS ITSELF THE BUG IT EXISTS TO CATCH. It
      # passed `--window-size=360,740` and announced a 360px phone check; headless
      # Chrome enforces a minimum window width and reported a 500px viewport, so
      # it measured 485px against 500px and went green having tested a screen 40%
      # wider than the one it named. A check that announces a wider claim than it
      # tests is this project's most-repeated defect, and it reached the step
      # written to prevent that class of defect.
      #
      # So the width is no longer requested from the browser -- it is IMPOSED. The
      # page is loaded in a same-origin iframe of exactly 360 CSS pixels and asked
      # for its own scrollWidth, which cannot be silently overridden by a window
      # minimum. The viewport meta is a separate claim and is tested separately in
      # test/document.test.js; an iframe cannot check that, and saying so is the
      # point.
      #
      # Local copies with the data alongside, because R2's CORS policy does not
      # name localhost and an empty page overflows nothing -- it would pass while
      # proving nothing.
      - name: the pages fit a phone
        run: |
          mkdir -p phone && cd phone
          curl -sSL "https://readthegame.co/?cb=${GITHUB_RUN_ID}" -o index.html
          curl -sSL "https://readthegame.co/game?cb=${GITHUB_RUN_ID}" -o game.html
          for d in catalog.json measures.json index.json; do
            curl -sS --fail "https://data.readthegame.co/$d" -o "$d"
          done
          # The policy is hash-pinned and separately tested; stripped here only so
          # the page may be framed and measured.
          sed -i 's#<meta http-equiv="Content-Security-Policy"[^>]*>##' index.html game.html
          sed -i 's#https://data\.readthegame\.co##g' index.html game.html

          # A CANARY, because a check that has never failed may be incapable of
          # failing. This one is deliberately 900px wide in a 360px frame, and the
          # step FAILS IF IT PASSES. Without it, "both pages fit" is
          # indistinguishable from "the comparison is broken" -- and the first
          # version of this gate went green while measuring the wrong screen, so
          # that is not a hypothetical here.
          cat > canary.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <title>canary</title></head><body style="margin:0">
          <div style="width:900px;height:20px;background:#c00"></div>
          </body></html>
          HTML

          WIDTH=360
          for f in index game canary; do
            cat > "probe-$f.html" <<HTML
          <!doctype html><html><head><meta charset="utf-8"><title>pending</title></head>
          <body style="margin:0">
          <iframe id="f" src="$f.html" style="width:${WIDTH}px;height:740px;border:0"></iframe>
          <script>
          setTimeout(function () {
            var f = document.getElementById('f');
            var d = f.contentDocument.documentElement;
            /* Three numbers, because two of them are different claims. The FRAME
               is what we imposed. The CLIENT width is the layout viewport inside
               it, which a desktop scrollbar makes ~15px narrower -- a phone uses
               an overlay scrollbar and takes none, so measuring against the
               client width is STRICTER than a real device, not looser. SCROLL is
               what the content actually needs. */
            document.title = 'FIT ' + f.clientWidth + ' ' + d.clientWidth + ' ' +
                             d.scrollWidth;
          }, 4000);
          </script>
          </body></html>
          HTML
          done

          python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 2
          fail=0
          for f in index game canary; do   # canary LAST: it must fail, and it proves the two above can
            dom=$(google-chrome --headless --no-sandbox --disable-gpu \
                    --virtual-time-budget=15000 --dump-dom \
                    "http://localhost:8099/probe-$f.html" 2>/dev/null)
            read -r _ frame client scroll <<<"$(echo "$dom" | grep -o 'FIT [0-9]* [0-9]* [0-9]*' | head -1)"
            if [ -z "$scroll" ]; then
              echo "::error::$f.html never reported a width — the probe did not run"
              fail=1; continue
            fi
            # THE MEASUREMENT MUST HAPPEN AT THE WIDTH WE CLAIMED. Without this
            # the step can silently grade a different screen, which is exactly
            # what it did on its first run at a 500px window.
            #
            # The FRAME is the assertion; the client width is allowed to be a
            # little narrower because a desktop scrollbar eats ~15px, and that
            # makes the test harder rather than easier.
            if [ "$frame" -ne "$WIDTH" ]; then
              echo "::error::$f.html was framed at ${frame}px, not the ${WIDTH}px this check claims"
              fail=1; continue
            fi
            over=0
            [ "$scroll" -gt $((client + 1)) ] && over=1
            if [ "$f" = canary ]; then
              # The mutation. It MUST overflow; if it does not, the comparison
              # above is not working and every green above it means nothing.
              if [ "$over" = 1 ]; then
                echo "  canary: 900px in ${client}px correctly reported as overflow — the check can fail"
              else
                echo "::error::the canary did NOT report overflow — this gate cannot detect one"
                fail=1
              fi
              continue
            fi
            echo "  $f.html: framed ${WIDTH}px, laid out at ${client}px, content needs ${scroll}px"
            if [ "$over" = 1 ]; then
              echo "::error::$f.html needs ${scroll}px in a ${client}px viewport — it scrolls sideways"
              fail=1
            fi
          done
          kill %1 2>/dev/null || true
          exit $fail

      # THE FRONT DOOR'S PREVIEW IS A PAGE INSIDE A PAGE, and nothing above can
      # see inside it. The step before this measures horizontal overflow of the
      # OUTER document; the hero is an iframe, so a rink squashed to a sliver
      # inside it, or cropped by its frame, costs the outer page not one pixel of
      # width. Three renderings of this feature shipped broken -- a blur, a crop,
      # and a scoreboard eating 56% of a phone frame -- and the whole suite
      # stayed green through all three, because the fake document the unit tests
      # run against has no CSS and no layout.
      #
      # IT TOOK TWO RED DEPLOYS AND A DIAGNOSTIC RUN TO GET HERE, and the cause
      # was not the probe, the nesting, or the browser. It was the PORT: the step
      # at "a page nobody can style" already runs `http.server 8098` and never
      # stops it, so this step's own server died with EADDRINUSE (silenced by
      # `>/dev/null 2>&1`) and Chrome dutifully measured 404s from somebody
      # else's directory. I had copied the port from that step without checking
      # it was free.
      #
      # So it uses its own port AND PROVES THE SERVER IS ITS OWN before believing
      # anything, because "a server answered" and "my server answered" are
      # different facts and only one of them was true.
      - name: the front door's preview fits its frame
        run: |
          cd phone
          mkdir -p extract
          ID=$(python3 -c "
          import json
          g=[x for x in json.load(open('catalog.json'))['games'] if x.get('v') and x.get('t') in (2,3)]
          g.sort(key=lambda x:(x['d'],x['id']))
          print(g[-1]['id'])")
          # A real extract, because the shell fetches its game and a page that
          # failed to load renders NO PREVIEW AT ALL: boot() never runs, the
          # preview class is never added, and the probe reports tidy numbers for
          # the error state. `cls` is therefore checked before any geometry.
          curl -sS --fail "https://data.readthegame.co/extract/$ID.json" -o "extract/$ID.json"
          echo "  newest viewable game is $ID"

          for box in 287x184 856x462 canary:287x60; do
            wh=${box##*:}; W=${wh%x*}; H=${wh#*x}
            cat > "prev-$W-$H.html" <<HTML
          <!doctype html><html><head><meta charset="utf-8"><title>pending</title></head>
          <body style="margin:0">
          <iframe id="f" src="game.html?game=$ID&preview=1"
                  style="width:${W}px;height:${H}px;border:0"></iframe>
          <script>
          window.onerror = function (m) { document.title = 'PREVERR ' + m; };
          setTimeout(function () {
            try {
              var f = document.getElementById('f'), d = f.contentDocument, w = f.contentWindow;
              var rg = d.getElementById('rg'), b = d.querySelector('.board');
              document.title = 'PREV ' + (rg ? (rg.className || 'noclass') : 'norg') + ' ' +
                w.innerWidth + ' ' + w.innerHeight + ' ' +
                d.documentElement.scrollWidth + ' ' + d.documentElement.scrollHeight + ' ' +
                (b ? Math.round(b.getBoundingClientRect().height) : 0);
            } catch (e) { document.title = 'PREVTHROW ' + e.message; }
          }, 6000);
          </script></body></html>
          HTML
          done

          PORT=8123
          SENTINEL="mine-${GITHUB_RUN_ID}.txt"
          echo "$GITHUB_RUN_ID" > "$SENTINEL"
          python3 -m http.server "$PORT" >server.log 2>&1 &
          sleep 3
          # THE CHECK THAT WOULD HAVE SAVED TWO DEPLOYS. A file only this run
          # wrote, in the directory this run means to serve.
          if [ "$(curl -sS "http://localhost:$PORT/$SENTINEL" || true)" != "$GITHUB_RUN_ID" ]; then
            echo "::error::port $PORT is not serving this step's directory — something else holds it"
            cat server.log || true
            ss -ltnp 2>/dev/null | grep ":$PORT" || true
            exit 1
          fi

          fail=0
          for box in 287x184 856x462 canary:287x60; do
            kind=${box%%:*}; [ "$kind" = "$box" ] && kind=real
            wh=${box##*:}; W=${wh%x*}; H=${wh#*x}
            dom=$(google-chrome --headless --no-sandbox --disable-gpu \
                    --virtual-time-budget=15000 --dump-dom \
                    "http://localhost:$PORT/prev-$W-$H.html" 2>/dev/null)
            read -r _ cls fw fh sw sh bh <<<"$(echo "$dom" \
                 | grep -o 'PREV [a-z]* [0-9]* [0-9]* [0-9]* [0-9]* [0-9]*' | head -1)" || true
            if [ -z "$bh" ]; then
              echo "::error::the preview probe never reported at ${W}x${H}"
              echo "$dom" | grep -o 'PREV[A-Z]* [^<]*' | head -2 || true
              fail=1; continue
            fi
            if [ "$cls" != "preview" ]; then
              echo "::error::at ${W}x${H} the frame is not in preview mode (#rg class \"$cls\") — it never booted"
              fail=1; continue
            fi
            bad=0
            [ "$sw" -gt $((fw + 1)) ] && bad=1
            [ "$sh" -gt $((fh + 1)) ] && bad=1
            # THE SCOREBOARD MAY NOT EAT THE ICE. It was 87px of a 155px frame on
            # a phone (56%) while being 87px of 462px on a desktop -- the same
            # absolute height in both, which was the whole defect. A third is
            # generous and still catches that by a wide margin.
            [ $((bh * 3)) -gt "$fh" ] && bad=1
            if [ "$kind" = canary ]; then
              # The mutation, and the step FAILS IF IT PASSES. Three greens are
              # otherwise indistinguishable from a probe measuring nothing --
              # which is exactly what the first two versions of this step did.
              if [ "$bad" = 1 ]; then
                echo "  canary: ${bh}px of chrome in a ${fh}px frame correctly rejected — this gate can fail"
              else
                echo "::error::the canary was accepted — this gate cannot detect a crowded frame"
                fail=1
              fi
              continue
            fi
            echo "  ${W}x${H}: content needs ${sw}x${sh}, scoreboard ${bh}px"
            [ "$sw" -gt $((fw + 1)) ] && { echo "::error::the preview scrolls sideways inside its own frame"; fail=1; }
            [ "$sh" -gt $((fh + 1)) ] && { echo "::error::the preview is taller than its frame — the rink is cropped"; fail=1; }
            [ $((bh * 3)) -gt "$fh" ] && { echo "::error::the scoreboard is ${bh}px of a ${fh}px frame — over a third of the taste is chrome"; fail=1; }
          done
          kill %1 2>/dev/null || true
          exit $fail

      # THE DOT MUST LAND WHERE THE SENTENCE SAYS, and only a stylesheet can
      # settle that. `test/render.test.js` already reconciles the two — it reads
      # "it lost 243 of 708" out of the prose and requires the dot's own position
      # to be 34.3% — and it was GREEN while every visitor saw the dot pinned to
      # the far left of the track on every game in the archive.
      #
      # Because the card is a <p>, every part of it must be a <span>, and a span
      # is inline: it ignores `height` and takes its width from its content.
      # `.vtrack`'s only two children are absolutely positioned, so it had no
      # content and no width, and `left:34.3%` of zero pixels is zero. `.vk` and
      # `.rate` beside it carry `display:block`; these two did not.
      #
      # The markup was right and the pixels were wrong, which is precisely the
      # gap the fake document cannot see across. So this step measures BOXES:
      # the width of the track, and where in it the dot's centre actually is.
      - name: the verdict dot lands where the sentence says
        run: |
          cd phone
          # Up to five recent games, because the card legitimately shows no track
          # when the archive holds no comparable lead — and a step that silently
          # accepted that state would be measuring nothing. If none of five draw
          # one, that is itself worth a red.
          IDS=$(python3 -c "
          import json
          g=[x for x in json.load(open('catalog.json'))['games'] if x.get('v') and x.get('t') in (2,3)]
          g.sort(key=lambda x:(x['d'],x['id']))
          print(' '.join(str(x['id']) for x in g[-5:][::-1]))")
          mkdir -p extract

          # THE CANARY IS THE DEFECT ITSELF. A copy of the page with `.vtrack`
          # put back to inline. The step FAILS IF THIS ONE PASSES — otherwise a
          # green here is indistinguishable from a probe that measured an element
          # it never found. The CSP is already stripped in this directory, so the
          # extra block is permitted; on the real page it would be refused.
          #
          # BEFORE </body>, NOT </head>, and the first version got this wrong: it
          # injected at </head> and the canary measured a healthy 541px, because
          # the page's own stylesheet is at line 44 — INSIDE the body. Both rules
          # are `#rg .vtrack`, so specificity is a tie and document order decides,
          # and the override was arriving first. A canary placed where it cannot
          # win is a canary that always sings.
          sed 's|</body>|<style>#rg .vtrack{display:inline}</style></body>|' \
            game.html > game-canary.html
          grep -q 'vtrack{display:inline}' game-canary.html || {
            echo "::error::the canary override was never injected"; exit 1; }

          # THE SRC IS BAKED IN, one probe file per page and game.
          #
          # The first version of this step set `iframe.src` from `location.search`
          # after load, and every game came back "no track" — including three
          # that provably have a rate. Under `--virtual-time-budget` the clock
          # runs ahead of a navigation the document did not start with, so the
          # measurement fired against a frame that had never booted. The preview
          # gate above writes its src into the markup and works; this now does the
          # same thing for the same reason.
          probe () {   # $1 = tag, $2 = page, $3 = game id
            cat > "probe-$1-$3.html" <<HTML
          <!doctype html><html><head><meta charset="utf-8"><title>pending</title></head>
          <body style="margin:0">
          <iframe id="f" src="$2?game=$3" style="width:900px;height:2400px;border:0"></iframe>
          <script>
          window.onerror = function (m) { document.title = 'VERD throw ' + m; };
          setTimeout(function () {
            try {
              var d = document.getElementById('f').contentDocument;
              /* BOOTED IS ITS OWN FIELD, and the last version had no such field.
                 It asked whether #verdict existed — but #verdict is in the static
                 markup, so an empty one answers yes. Every failure then looked
                 like "this game has no rate", which is a legitimate state, and
                 the step reported the wrong reason five times in a row. #gl is
                 written by boot() and is the same marker the live-watch step
                 below uses. */
              var gl = d.getElementById('gl'), v = d.getElementById('verdict');
              var booted = gl && /final/.test(gl.textContent || '') ? 1 : 0;
              var tr = d.querySelector('#rg .vtrack'), pt = d.getElementById('vpt');
              var m = (v && v.textContent || '').match(/it lost (\d+) of (\d+)/);
              if (!booted || !tr || !pt) {
                document.title = 'VERD ' + booted + ' 0 0 0 0 0';
                return;
              }
              var a = tr.getBoundingClientRect(), b = pt.getBoundingClientRect();
              /* The CENTRE of the dot, as a fraction of the track it sits in.
                 \`.vpt\` is translate(-50%,-50%) so its left edge is not its
                 position, and reading \`style.left\` back would only re-report
                 what the script wrote — which is the number that was already
                 green while the pixels were wrong. */
              var pct = a.width ? ((b.left + b.width / 2 - a.left) / a.width * 100) : -1;
              document.title = 'VERD 1 1 ' + Math.round(a.width) + ' ' +
                pct.toFixed(1) + ' ' + (m ? m[1] + ' ' + m[2] : '0 0');
            } catch (e) { document.title = 'VERD throw ' + e.message; }
          }, 6000);
          </script></body></html>
          HTML
          }

          PORT=8137
          SENTINEL="verdict-${GITHUB_RUN_ID}.txt"
          echo "$GITHUB_RUN_ID" > "$SENTINEL"
          python3 -m http.server "$PORT" >verdict-server.log 2>&1 &
          sleep 3
          if [ "$(curl -sS "http://localhost:$PORT/$SENTINEL" || true)" != "$GITHUB_RUN_ID" ]; then
            echo "::error::port $PORT is not serving this step's directory — something else holds it"
            cat verdict-server.log || true
            ss -ltnp 2>/dev/null | grep ":$PORT" || true
            exit 1
          fi

          measure() {   # $1 = tag, $2 = game id -> "booted hastrack width pct count n"
            google-chrome --headless --no-sandbox --disable-gpu \
              --virtual-time-budget=15000 --dump-dom \
              "http://localhost:$PORT/probe-$1-$2.html" 2>/dev/null \
              | grep -o 'VERD [0-9a-z]*[ 0-9.-]*' | head -1
          }

          ID=""; anyboot=0
          for g in $IDS; do
            curl -sS --fail "https://data.readthegame.co/extract/$g.json" -o "extract/$g.json" || continue
            probe real game.html "$g"
            read -r _ booted hastrack width pct count n <<<"$(measure real "$g")" || true
            [ "$booted" = 1 ] && anyboot=1
            if [ "$booted" != 1 ]; then echo "    $g: the page never booted (probe: $booted)"; continue; fi
            if [ "$hastrack" != 1 ] || [ "${count:-0}" = 0 ]; then
              echo "    $g: the card shows no comparison, so there is no dot to place"
              continue
            fi
            ID=$g; break
          done
          if [ "$anyboot" != 1 ]; then
            echo "::error::not one of the five pages booted — this step measured nothing at all"
            kill %1 2>/dev/null || true; exit 1
          fi
          if [ -z "$ID" ]; then
            echo "::error::the pages booted but none drew a rate — nothing was measured"
            kill %1 2>/dev/null || true; exit 1
          fi

          want=$(python3 -c "print(f'{$count/$n*100:.1f}')")
          echo "  game $ID: the card says it lost $count of $n, which is ${want}%"
          echo "  the track is ${width}px wide and the dot's centre is at ${pct}%"

          fail=0
          # A track narrower than this is the inline-span defect, not a layout
          # choice: the card is 56ch inside a 900px frame.
          [ "$width" -ge 200 ] || { echo "::error::the track is ${width}px wide — it has collapsed"; fail=1; }
          off=$(python3 -c "print(1 if abs($pct-$want)>1.5 else 0)")
          [ "$off" = 0 ] || { echo "::error::the dot sits at ${pct}% of the track; the sentence says ${want}%"; fail=1; }

          probe canary game-canary.html "$ID"
          read -r _ cboot _ cwidth _ _ _ <<<"$(measure canary "$ID")" || true
          if [ "$cboot" != 1 ]; then
            echo "::error::the canary page never booted, so its verdict proves nothing"
            fail=1
          elif [ "${cwidth:-0}" -ge 200 ]; then
            echo "::error::the canary's collapsed track measured ${cwidth}px — this step cannot detect the defect"
            fail=1
          else
            echo "  canary: an inline .vtrack measures ${cwidth:-0}px — this gate can fail"
          fi
          kill %1 2>/dev/null || true
          exit $fail

      - name: a visitor can actually watch a game
        run: |
          for i in $(seq 1 12); do
            curl -sSL -o live-shell.html "https://readthegame.co/game?cb=${GITHUB_RUN_ID}-w${i}" || true
            cmp -s live-shell.html src/game.html && break
            echo "    attempt $i: production is still serving a different build"
            sleep 6
          done
          if ! cmp -s live-shell.html src/game.html; then
            echo "::error::production never served this build of game.html"; exit 1
          fi
          echo "  production is serving this build; loading it in a browser"

          # What the page SHOULD say, derived from the same catalog it reads --
          # not a string typed here. A hard-coded expectation is the defect this
          # check exists to catch, one level up.
          curl -sS -o cat.json "https://data.readthegame.co/catalog.json?cb=${GITHUB_RUN_ID}"
          # A CRASH HERE USED TO BE SILENT. This ran inside `$(...)` feeding
          # `read`, and `read` succeeds on empty input, so an empty catalog threw
          # an IndexError, printed a traceback, and the step carried on with a
          # blank expectation -- which then made the glob match at the bottom
          # VACUOUS, because `case "$line" in *""*` matches every string alive.
          # The step still went red, but only because a different branch caught
          # the error text. Correct by accident is indistinguishable from correct
          # by design until the accident stops happening.
          if ! python3 - > want.txt <<'PY'
          import json, sys
          v = [g for g in json.load(open('cat.json'))['games'] if g.get('v')]
          if not v:
              sys.exit("the published catalog names no viewable game")
          v.sort(key=lambda g: (g['d'], g['id']))
          g = v[-1]
          M = ['January','February','March','April','May','June','July','August',
               'September','October','November','December']
          y, m, d = g['d'].split('-')
          print(f"{g['a']}|{g['h']}", f"{int(d)} {M[int(m)-1]} {y}")
          PY
          then
            echo "::error::cannot derive what the page should say from catalog.json"
            exit 1
          fi
          read -r WANT_AB WANT_DATE < want.txt
          A=${WANT_AB%%|*}; H=${WANT_AB##*|}
          # AN EMPTY EXPECTATION IS NOT A PASSING ONE.
          if [ -z "$A" ] || [ -z "$H" ] || [ -z "$WANT_DATE" ]; then
            echo "::error::the expectation is blank, so the check below would pass on anything"
            exit 1
          fi
          echo "  the catalog says the newest viewable game is $A at $H on $WANT_DATE"

          fail=1
          for i in $(seq 1 8); do
            google-chrome --headless --no-sandbox --disable-gpu \
              --virtual-time-budget=20000 --dump-dom \
              "https://readthegame.co/game?cb=${GITHUB_RUN_ID}-${i}" > g.html 2>/dev/null || true
            line=$(grep -o 'id="gl"[^>]*>[^<]*' g.html | sed 's/.*>//' || true)
            case "$line" in
              *"could not be loaded"*) echo "::error::the shell says: $line"; exit 1 ;;
              *" at "*final*) fail=0; break ;;
              *) echo "    attempt $i: \"$line\"" ;;
            esac
            sleep 8
          done
          if [ "$fail" != 0 ]; then
            echo "::error::the shell never rendered a game — last line: \"$line\""
            echo "  it fetches catalog.json and extract/*.json from data.readthegame.co;"
            echo "  if this is silent, check the R2 CORS policy (r2-cors workflow)"
            exit 1
          fi
          echo "  the live shell reports: $line"

          # The teams AND the date must be the ones this game actually has.
          # Checking only that SOMETHING rendered is what let a wrong date pass.
          for want in "$A at $H" "$WANT_DATE"; do
            case "$line" in
              *"$want"*) ;;
              *) echo "::error::the shell rendered \"$line\", which does not contain \"$want\""
                 exit 1 ;;
            esac
          done
          echo "  and it matches the catalog on both teams and date"

      # THE POLICY'S OWN VERDICT, READ BACK.
      #
      # Every other browser step in this file STRIPS the CSP, and has to: framing
      # the page or rewriting the data origin changes the script's bytes, so the
      # pinned hash no longer matches and the browser blanks the page. Which
      # means nothing we had could see a violation — and thirteen of them were
      # live. `game.html` shipped thirteen `style=` attributes under a `style-src`
      # that names only hashes, and there is no such thing as a hash for an
      # attribute. The browser refused all thirteen, said so in a console nobody
      # was reading, and rendered the page: the team swatches beside "More MIN
      # games" computed to rgba(0, 0, 0, 0) and the verdict dot sat at the far
      # left of its track on every game in the archive.
      #
      # `test/document.test.js` forbids the attribute at build time, which closes
      # that instance. This step closes the CLASS: it asks the browser whether the
      # live page, under its real policy and with its real data, was refused
      # anything at all — a question no grep of ours can answer.
      - name: the live game raises no policy refusal
        run: |
          # A CANARY FIRST, and it is not decoration here. A console grep that has
          # never matched is indistinguishable from a console that is not being
          # captured, and this whole step is one grep of one log. So: a page with
          # the same SHAPE of policy — hashes only, no 'unsafe-inline' — and one
          # inline style on it. The step FAILS IF THIS COMES BACK CLEAN. The hash
          # below is arbitrary and that is the point: no attribute can ever match
          # any hash, which is exactly the situation on the real page.
          cat > canary-csp.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <meta http-equiv="Content-Security-Policy"
                content="default-src 'none'; style-src 'sha256-3w1CAvQ0dwQ8i7dr8jNAwLnzsQpx8bLTPjB7C4yRcVs='">
          <title>canary</title></head>
          <body><p style="color:#c00">this style must be refused</p></body></html>
          HTML
          google-chrome --headless --no-sandbox --disable-gpu \
            --enable-logging=stderr --log-level=0 \
            --virtual-time-budget=4000 --dump-dom \
            "file://$PWD/canary-csp.html" > /dev/null 2> canary.log || true
          if ! grep -qi 'Refused to apply inline style' canary.log; then
            echo "::error::the canary's refusal was never captured — this step cannot see a violation"
            echo "  an inline style under a hash-only style-src MUST be reported, and was not."
            head -20 canary.log
            exit 1
          fi
          echo "  canary: a refused inline style is visible to this step"

          google-chrome --headless --no-sandbox --disable-gpu \
            --enable-logging=stderr --log-level=0 \
            --virtual-time-budget=20000 --dump-dom \
            "https://readthegame.co/game?cb=${GITHUB_RUN_ID}-csp" > /dev/null 2> live.log || true
          # The implicit /favicon.ico request is browser-initiated and browsers
          # report it inconsistently; it is not something the page asked for.
          # Everything else refused here is ours, and is a defect.
          if grep -i 'Refused to' live.log | grep -vi favicon; then
            echo "::error::the live game page was refused something by its own CSP"
            echo "  static styling belongs in the stylesheet; dynamic styling goes"
            echo "  through the CSSOM (el.style.x = y), which no policy restricts."
            exit 1
          fi
          echo "  the live game page ran under its real policy with nothing refused"

      - name: summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "**https://readthegame.co**"
            echo ""
            for host in $PUBLIC_HOSTS; do echo "- https://${host}"; done
            echo ""
            echo "Immutable URL for this commit: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
