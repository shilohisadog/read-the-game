# Publish src/ to Cloudflare Pages.
#
# WHY FROM CI AND NOT A LAPTOP. Wrangler requires Node >= 22 and the development
# machine runs 20, so a local deploy would mean upgrading the runtime the test
# suite is pinned against in order to ship a static folder. It would also put a
# Cloudflare credential on a laptop. Here the token never leaves GitHub, and the
# deploy always runs from a clean checkout -- so only committed files can be
# published. Nothing untracked or gitignored can reach the public site by
# accident, which has happened once already (builders/build_rules.py, f4a2c67).
#
# THE GATES RUN BEFORE THE DEPLOY, IN THIS JOB. gates.yml proves the commit is
# sound, but a separate workflow is a separate run: relying on it would mean
# publishing on the assumption that the other job passed. The check that guards
# a deploy has to be the deploy's own.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one midway -- a half-finished upload
# to a live site is worse than a queued one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read      # to find the last successful deploy run (did this push change the site)

env:
  PROJECT: read-the-game
  WRANGLER: wrangler@4.120.0   # pinned: "whatever npx resolved to today" is not a build
  # The hostnames people actually visit. Verifying only <project>.pages.dev
  # would leave the gate proving a URL nobody uses, and a custom domain can
  # come detached -- the binding lives in Cloudflare, not in this repo.
  PUBLIC_HOSTS: readthegame.co www.readthegame.co read-the-game.pages.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ⭐ FULL HISTORY, BECAUSE refcheck READS IT. `tools/refcheck.py` verifies
      # revision-pinned citations with `git show <rev>:<path>` — the form that
      # lets a dated design doc stay checkable after the code it describes has
      # moved. The default checkout is SHALLOW, so those revisions are not in the
      # clone and every historical citation failed with "no builders/build_main.py
      # at revision 29f4c30" on the first CI run after it shipped. Green locally,
      # red here, because full history is the thing a laptop has and a runner
      # does not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: gates
        run: npm run gates
      # A generated file that differs from what its builder produces means the
      # HTML was hand-edited. Shipping that publishes something no builder can
      # reproduce, and the next build silently reverts it.
      - name: the working tree must be unchanged by a build
        run: git diff --exit-code
      # The pages that inline their whole game must still call nobody. This grep
      # is a blacklist over an open vocabulary and cannot close -- it is blind to
      # import(), EventSource, sendBeacon and window["fetch"] -- so it is a
      # backstop, not the guarantee. A page that legitimately reaches the archive
      # is held to a CSP the browser enforces, which is the stronger promise.
      #
      # ⭐ WHICH PAGES THOSE ARE IS READ OFF THE PAGES, NOT TYPED HERE. This step
      # used to exempt `index|game` by name, and the comment beside the list
      # already stated the real reason: their guarantee is the policy, not their
      # filename. So when calendar.html became the third page that fetches, it
      # fell outside a hand-typed list and failed a gate that had no opinion
      # about it -- the list was the defect, not the page. The exemption is now
      # the property that justified it, which no new page can fall outside of.
      - name: a page reaches the network only where its own policy says so
        run: |
          # ⭐ THE TWO FACTS MUST AGREE, IN BOTH DIRECTIONS.
          #
          # This step used to exempt `index|game` BY NAME while the comment
          # beside the list stated the real reason: their guarantee is a CSP the
          # browser enforces, not their filename. So when calendar.html became
          # the third page that fetches, it fell outside a hand-typed list and
          # failed a gate that had no opinion about it. The list was the defect.
          #
          # Reading the exemption off the policy is the fix, and on its own it
          # is only half of one -- a page that DECLARES a reach it never uses
          # would exempt itself from the check meant to hold it, silently, and
          # two pages were already in that state (what-you-can-see and workshop
          # inherited the data origin from a shared builder). Mutating every
          # page to "allowed" did not turn this red until both directions were
          # asserted. So: declaring the archive and calling out must be the same
          # set of pages, and either one alone is a failure.
          fail=0; both=0; neither=0
          for f in src/*.html; do
            says=0; does=0
            grep -qE "connect-src [^\"]*https://data\.readthegame\.co" "$f" && says=1
            grep -qiE 'fetch\(|XMLHttpRequest|new WebSocket|src="https?:|<link[^>]+https?:' "$f" && does=1
            if [ "$says" = 1 ] && [ "$does" = 1 ]; then both=$((both+1)); continue; fi
            if [ "$says" = 0 ] && [ "$does" = 0 ]; then neither=$((neither+1)); continue; fi
            if [ "$does" = 1 ]; then
              echo "::error::$f reaches the network and its own policy does not permit it"
            else
              echo "::error::$f declares the archive in its policy and never reads it -- least privilege, and an unused permission exempts the page from this check"
            fi
            fail=1
          done
          # Printed so the failure mode where every page drifts into one bucket
          # is visible rather than silently green.
          echo "$both pages fetch and say so; $neither reach nothing and say nothing"
          [ "$both" -gt 0 ] && [ "$neither" -gt 0 ] || {
            echo "::error::every page landed in one bucket -- this gate stopped separating anything"; fail=1; }
          exit $fail
      # `tools/browser/pages-csp.mjs` — a hash-pinned policy with a stale hash is a
      # blank page that passes every grep we could write, so a real browser walks
      # the built pages. Its canary (one page with a comment inserted into its
      # first script block) must be refused, or the probe is blind.
      - name: every page is permitted to run under its own CSP
        run: node tools/browser/run.mjs pages-csp

      # `tools/browser/index-runs.mjs` — the policy must EXECUTE: the placeholder
      # has to be replaced by the page's own script, and nothing may be refused.
      # ⚠️ It does not prove the page works — over file:// the data fetch fails for
      # its own reasons, which is what `data-readable` is for.
      - name: the index is permitted to run under its own CSP
        run: node tools/browser/run.mjs index-runs

      # `tools/browser/stylesheet-settles.mjs` — the claims a fake document cannot
      # see: the caption is revealed by a rule, the layer box is one height across
      # six states and clips nothing at 360, the pill clears the box, the hero's
      # pill stays under the ice at both widths, and the visitor's mark is white
      # while the host's is not (five matchups share a hex).
      - name: what only a stylesheet can settle
        run: node tools/browser/run.mjs stylesheet-settles

      # `tools/browser/states.mjs` — the states no probe was entering. Each one
      # SEEKS its subject and goes red if it never found it, which is the fault
      # the first version had: it sampled 55% of the scrub, landed on a faceoff,
      # and reported a clean hash of a frame with no figure on it. Six planted
      # defects turn these red, including the one that was live in both readers
      # (a goal's mark is a `<g>` with children, so `ev.target` missed the door).
      - name: the replay's states, entered on purpose
        run: node tools/browser/run.mjs replay-states

      # THE LEARN PAGE'S DOORS POINT AT ONE GAME, so that game being published
      # is a production dependency of nine links on a page a stranger reads.
      #
      # Nothing offline can check it. The builder proves each moment exists in
      # data/rich.json, and the tests prove every href parses -- but "the archive
      # still publishes this game" is a fact about the live bucket, and a
      # re-judge that refused it would break all nine at once with every test
      # green. build_B.py and build_rules.py carried this exposure before they
      # were removed (B8, 2026-09-03); the
      # learn page is the first to put it in front of a visitor.
      #
      # AND STATUS TELLS YOU NOTHING HERE. Unknown paths on this deployment
      # answer 200 with the home page, so fetching a door and seeing 200 is not
      # evidence -- the check has to be that the id is in the catalog with a
      # publishable verdict, and that its extract parses as the game we named.
      - name: the game the learn page opens is still published
        run: |
          id=$(python3 -c "import json;print(json.load(open('data/learn-doors.json'))['game']['id'])")
          echo "  the doors name game $id"
          curl -sS --fail "https://data.readthegame.co/catalog.json?cb=${GITHUB_RUN_ID}" -o cat.json
          curl -sS --fail "https://data.readthegame.co/extract/$id.json?cb=${GITHUB_RUN_ID}" -o ex.json
          python3 - "$id" <<'PYCHECK'
          import json, sys
          gid = int(sys.argv[1])
          row = {r["id"]: r for r in json.load(open("cat.json"))["games"]}.get(gid)
          if not row:
              sys.exit(f"::error::game {gid} is not in the published catalog — "
                       "every door on the learn page is broken")
          if row.get("v") != 1:
              sys.exit(f"::error::game {gid} is in the catalog but refused "
                       f"(r={row.get('r')}) — the learn page opens onto nothing")
          g = json.load(open("ex.json"))
          if g["game"]["id"] != gid:
              sys.exit(f"::error::extract/{gid}.json describes game {g['game']['id']}")
          print(f"  published: {row['a']} at {row['h']}, {row['d']}, "
                f"{len(g['events'])} events — the doors have somewhere to open")
          PYCHECK
          # THE CHECK MUST BE ABLE TO FAIL. A catalog lookup that silently found
          # nothing would pass this step by printing nothing at all.
          python3 - <<'PYCANARY'
          import json
          rows = {r["id"]: r for r in json.load(open("cat.json"))["games"]}
          assert 1 not in rows, "game id 1 exists — pick another impossible id"
          print("  canary: an absent id is absent, so the lookup can miss")
          PYCANARY

      # ⭐ THE RELEASE GATE, RULED BY KEVIN 2026-09-17 (docs/test-program.md §5.1).
      #
      # Until this change every browser check that needed the DEPLOYED page ran
      # after production had already been replaced -- 6 of the 9 browser steps in
      # this file tested the release instead of gating it. Now a push that
      # changes src/ deploys FIRST as a preview (step 4 of the test
      # re-architecture proved a preview reads production data), every browser
      # check runs against that preview, and only if they pass does the SAME
      # commit deploy to production. After production, only what production
      # alone can answer: the custom domains serve these bytes, a visitor on the
      # real origin can read the data, and the zone's edge rewrites trip no
      # policy. Byte identity (the diff step) is what lets a check on the preview
      # stand for production.
      #
      # No human waits here before beta; Kevin reviews what shipped in batches.
      # AT BETA he becomes the required reviewer on the production deploy -- one
      # `environment:` line on that step, and the fallback becomes hold.
      #
      # AND A PUSH THAT CHANGES NOTHING A VISITOR RECEIVES SHIPS NOTHING. Docs,
      # tests and tooling are compared against the last SUCCESSFUL deploy run;
      # anything uncertain (no earlier run, a commit not in this clone, a run by
      # hand) deploys, because the safe error here is an unnecessary deploy.
      - name: did this push change the site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "  run by hand: deploying regardless"
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list --workflow deploy.yml --branch main --status success \
                   --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          if [ -z "$last" ] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            echo "  no earlier successful deploy to compare with ('$last') -- deploying"
            changed=true
          elif git diff --quiet "$last" HEAD -- src/; then
            echo "  src/ is unchanged since $last, the last successful deploy -- nothing to ship"
            changed=false
          else
            echo "  src/ changed since $last, the last successful deploy:"
            git --no-pager diff --stat "$last" HEAD -- src/ | tail -8
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: ensure the Pages project exists
        if: steps.site.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creating an existing project is an error, so ask first rather than
          # swallowing failures with `|| true` -- that would also hide a bad
          # token, and the deploy would fail later with a confusing message.
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            echo "project $PROJECT already exists"
          else
            echo "creating project $PROJECT"
            npx --yes "$WRANGLER" pages project create "$PROJECT" \
              --production-branch main
          fi

      # THE PREVIEW IS THIS COMMIT, PROVEN BEFORE ANYTHING IS MEASURED ON IT.
      # A new hostname answers 522 for roughly 40 seconds (see the diff step), and
      # a check that measured an error page, or an older deployment, would be
      # grading something nobody is about to ship. *.pages.dev is not on the zone,
      # so no edge rewrite applies and the comparison is raw bytes.
      - name: deploy this commit as a preview
        id: preview
        if: steps.site.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy src \
            --project-name "$PROJECT" \
            --branch candidate \
            --commit-dirty=true | tee preview.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' preview.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::no preview URL was captured from wrangler -- nothing to check, so nothing ships"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for page in index.html game.html; do
            ok=0
            for i in $(seq 1 15); do
              code=$(curl -sS -L -o got.html -w '%{http_code}' "$url/$page?cb=${GITHUB_RUN_ID}-$i") || code=000
              if [ "$code" = 200 ] && cmp -s got.html "src/$page"; then ok=1; break; fi
              echo "    $page: HTTP $code, not yet this commit -- attempt $i"
              sleep 6
            done
            if [ "$ok" != 1 ]; then
              echo "::error::the preview never served this commit's $page"; exit 1
            fi
            echo "  $url serves this commit's $page"
          done

      # THE CHECK THAT WOULD HAVE CAUGHT THE CORS BUG. Everything above proves
      # the bytes we published are the bytes we committed; none of it proves a
      # BROWSER can use them. Load the live site as a visitor does and require
      # the freshness line to say something real -- "No data loaded yet" on a
      # site holding games means the data could not be read, whatever the reason.
      # ⭐ THE CHECK ITSELF LIVES IN `tools/browser/`, NOT IN THIS FILE. It was
      # ~60 lines of bash and a grep here, runnable only by pushing; it is now
      # `node tools/browser/run.mjs data-readable`, which a laptop can run against
      # any site and whose judgement is unit-tested (test/browser-checks.test.js).
      # What it asserts is unchanged, and the reason is in the module: curl cannot
      # see a CORS failure, so a real browser has to say the data arrived.
      - name: a visitor can actually read the data — on the preview
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs data-readable --site "${{ steps.preview.outputs.url }}"

      # ⭐ THE CHECK LIVES IN `tools/browser/phone-fit.mjs`, with its two canaries
      # (a 900px bar that must overflow, and the game page with no extract, which
      # must report no subject) and the reason the width is IMPOSED in an iframe:
      # headless Chrome enforces a minimum window width and this gate once graded
      # a screen 40% wider than the one it named. Its judgement is unit-tested.
      - name: the pages fit a phone
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs phone-fit --site "${{ steps.preview.outputs.url }}"

      # `tools/browser/preview-fits.mjs` — the hero is a page inside a page, and
      # nothing measuring the outer document can see into it. Three renderings
      # shipped broken past a green suite; the scoreboard may not eat a third of
      # the frame, and the preview must be proved BOOTED before any geometry.
      - name: the front door's preview fits its frame
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs preview-fits --site "${{ steps.preview.outputs.url }}"

      # `tools/browser/verdict-dot.mjs` — the unit test reconciling the sentence
      # with the dot was GREEN while every visitor saw the dot pinned to the left
      # of its track: the markup was right and the pixels were wrong. This measures
      # boxes, and its canary is the defect itself (an inline `.vtrack`).
      - name: the verdict dot lands where the sentence says
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs verdict-dot --site "${{ steps.preview.outputs.url }}"

      # `tools/browser/watch-a-game.mjs` — the page a link points at, and the only
      # one that fetches a GAME. What it should say is derived from the catalog it
      # reads, never typed in; both the clubs AND the date are checked, because
      # "something rendered" is what let a wrong date pass.
      # ⚠️ The preview URL is deployment-specific, so it can only serve THIS build;
      # on production the byte-diff step above has already waited for it.
      - name: a visitor can actually watch a game
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs watch-a-game --site "${{ steps.preview.outputs.url }}"

      # `tools/browser/csp-refusal.mjs` — every other browser check strips the CSP
      # and has to, so nothing we had could see a violation while thirteen were
      # live. This asks the browser whether the real page under its real policy was
      # refused anything, and a canary proves the console is being captured at all.
      - name: the game raises no policy refusal — on the preview
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs csp-refusal --site "${{ steps.preview.outputs.url }}"

      - name: deploy to production — the same commit the preview passed
        if: steps.site.outputs.changed == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy src \
            --project-name "$PROJECT" \
            --branch main \
            --commit-dirty=true | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

      # Deploying and assuming it worked is not verification. Fetch every page
      # back over the public internet and compare it byte for byte against the
      # file in this checkout -- 200 OK only proves something answered, not that
      # what is public is what we committed.
      #
      # RETRY EVERY PAGE, NOT JUST THE FIRST. A brand-new *.pages.dev hostname
      # takes roughly 40 seconds to come up and answers 522 until it does. The
      # first version of this step retried the root and then checked the other
      # pages once each, so the root spent six attempts waiting out propagation
      # and the very next request failed on the tail of the same cold start.
      # The deploy was fine; the check was shaped wrong.
      #
      # DIFF AGAINST THE DEPLOYMENT URL, NOT THE PRODUCTION HOSTNAME. Pages
      # gives every deployment its own immutable <hash>.<project>.pages.dev,
      # which is the artifact just uploaded with nothing aliased or cached in
      # front of it. The production hostname is a moving pointer with an edge
      # cache, and it served the previous build for minutes after a correct
      # deploy -- `?cb=1` on the same URL returned the new bytes, so the alias
      # had switched and only the cached object was stale. Diffing there tests
      # Cloudflare's cache invalidation, which is not our invariant. Production
      # is checked separately, for reachability, with the cache defeated.
      - name: fetch the live site back and diff it against the repo
        if: steps.site.outputs.changed == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::no deployment URL was captured from wrangler — cannot verify"
            exit 1
          fi
          URL="$DEPLOY_URL"
          echo "checking $URL"

          # AS A BROWSER, NOT AS CURL, AND THAT IS NOT A DETAIL.
          #
          # This step compares published bytes to committed bytes and passed
          # every run while Cloudflare injected a Web Analytics beacon into the
          # HTML — because the injection was USER-AGENT GATED. curl's default
          # agent got bytes identical to the repo; a Chrome agent got an extra
          # <script>. The step was measuring something no visitor receives, which
          # is this project's most-repeated defect, found inside the step written
          # to close it. Found by reading the live page's console in a real
          # browser, not by reading this file.
          #
          # The edge may rewrite HTML for a browser in other ways too (Rocket
          # Loader, email obfuscation, auto-minify are all UA- and content-type
          # sensitive). Asking as a browser is the only version of this question
          # whose answer is about the site people actually load.
          #
          # Checked before this line was written: all nine pages byte-identical
          # under a Chrome agent, the day after the beacon was turned off.
          VISITOR_UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'

          # Retries on 5xx (edge not ready) but NOT on 404 -- a missing file is
          # a real answer, and waiting 60s to report it just hides the cause.
          fetch() {  # fetch <path> <destination>
            local path="$1" dest="$2" code
            for i in $(seq 1 12); do
              # 000 is curl's code for a transport failure, which for a hostname
              # minutes old usually means DNS has not propagated yet -- another
              # thing to wait out rather than report as a broken site.
              code=$(curl -sS -A "$VISITOR_UA" -H 'Accept: text/html' \
                          -o "$dest" -w '%{http_code}' -L "$URL/$path") || code=000
              case "$code" in
                200)     return 0 ;;
                5*|000)  echo "    attempt $i: HTTP $code — edge not ready"; sleep 6 ;;
                *)       echo "::error::/$path returned HTTP $code"; return 1 ;;
              esac
            done
            echo "::error::/$path never became available (last HTTP $code)"
            return 1
          }

          # THE ONE NORMALISATION, AND IT IS NARROW ON PURPOSE.
          #
          # Cloudflare's Scrape Shield rewrites every mailto in the served HTML
          # into /cdn-cgi/l/email-protection#<hex> and injects a decoder script
          # to put it back. script-src here is hash-pinned, so the browser
          # REFUSES the decoder and the footer reads, to a real visitor, the
          # literal string "[email protected]". `<!--email_off-->` is
          # Cloudflare's documented per-block opt-out and it works -- the address
          # arrives intact -- but the zone CONSUMES the two marker comments, so
          # the served bytes are 33 shorter than the committed bytes.
          #
          # BOTH SIDES, not just the live one. This same step checks the
          # *.pages.dev deployment, which is not on the zone and therefore keeps
          # the markers. Stripping only the repo side would pass on the custom
          # domain and fail on the preview.
          #
          # What this can hide is exactly two literal comment strings that we put
          # in for the CDN to eat, and nothing else -- every other byte is still
          # compared. It comes out the moment Email Address Obfuscation is turned
          # off in the dashboard, which is the cleaner end state and Kevin's call.
          # TWO EDGE REWRITES, BOTH NAMED. (1) `<!--email_off-->` is a marker WE
          # add for Scrape Shield to eat so the mailto survives. (2) The Web
          # Analytics beacon is a THIRD-PARTY SCRIPT in the reader's page, on
          # deliberately, named in script-src so it runs — but never in our bytes.
          # Removed by an EXACT pattern, so anything else the edge adds, or any
          # change to the beacon's shape, still fails this comparison and is
          # printed. A gate that silently deletes injected scripts cannot do its
          # job; this one deletes exactly one known tag and reports that it did.
          strip() {
            # THE WHOLE LINE, ANCHORED. Substituting the tag alone left the
            # newline Cloudflare wrote with it, so the compare failed by exactly
            # one byte and the printed diff showed a blank line -- which reads as
            # nothing at all. The beacon is injected on its own line before
            # </body>; ^…$ means an inline one, or a moved one, does NOT get
            # deleted and fails the comparison instead. Canaried both ways.
            sed -e 's|<!--/\?email_off-->||g' \
                -e '\%^<script type="module" src="https://static\.cloudflareinsights\.com/beacon\.min\.js/[^>]*></script>$%d' "$1"
          }
          beacon_note() {
            grep -q 'static\.cloudflareinsights\.com' "$1" \
              && echo "      (edge injected the Web Analytics beacon — in script-src, stripped for this diff)" || true
          }

          # The root is its own case: it is not a file we deploy but a route
          # Pages resolves to index.html, and getting that wrong is a 404 on
          # the front page with every deep link still working.
          fetch "" root.html
          if ! cmp -s <(strip root.html) <(strip src/index.html); then
            echo "::error::the site root is not src/index.html"
            exit 1
          fi
          echo "  /  ->  index.html  ($(wc -c < root.html) bytes, identical)"
          beacon_note root.html

          fail=0
          for f in src/*.html; do
            page=$(basename "$f")
            fetch "$page" live.html || { fail=1; continue; }
            if cmp -s <(strip live.html) <(strip "$f"); then
              echo "  /$page  ($(wc -c < "$f") bytes, identical)"
              beacon_note live.html
            else
              echo "::error::/$page differs from $f — published bytes are not committed bytes"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "all $(ls src/*.html | wc -l) pages match the checkout byte for byte"

          # Production is a separate question: does each public hostname resolve
          # to this deployment at all?
          #
          # RETRY THE COMPARISON, NOT ONLY THE STATUS. The fetch helper retries
          # 5xx and 000 -- "not ready yet" -- but a hostname that has just been
          # deployed to can be perfectly ready and briefly serve the PREVIOUS
          # bytes with a 200. That is what happened on the first run of this
          # check: readthegame.co is tested first, seconds after the upload, and
          # failed while www and pages.dev, tested moments later, passed. The
          # deploy was correct and the site was correct within seconds.
          #
          # So a mismatch is not immediately a failure; it is "propagating"
          # until it has been given a bounded amount of time to stop being one.
          # A cache-busting query defeats the edge cache but cannot hurry the
          # alias itself.
          echo
          for host in $PUBLIC_HOSTS; do
            URL="https://${host}"
            matched=0
            for i in $(seq 1 10); do
              if fetch "?cb=${GITHUB_RUN_ID}-${i}" prod.html && cmp -s <(strip prod.html) <(strip src/index.html); then
                matched=1; break
              fi
              echo "    $host: serving a different build — attempt $i, waiting"
              sleep 6
            done
            if [ "$matched" = 1 ]; then
              echo "  https://${host} serves the current index"
              beacon_note prod.html
            else
              # ONE MESSAGE WAS STANDING FOR TWO DIFFERENT FAILURES, and it cost
              # a wasted re-run to find that out. The loop breaks only when the
              # fetch AND the compare both succeed, so content that never matches
              # exhausts the retries and reports "never served this deployment" --
              # which reads as a DNS or alias problem and sends you to the wrong
              # dashboard. Same shape as the caption's `on` class: a single signal
              # that cannot distinguish the two states it is asked about.
              if [ -s prod.html ]; then
                echo "::error::https://${host} answers, but serves bytes we did not commit"
                echo "  fetched $(wc -c < prod.html) bytes, repo has $(wc -c < src/index.html)"
                echo "  --- what the edge added or changed (first 20 lines) ---"
                diff <(sed 's/></>\n</g' prod.html) <(sed 's/></>\n</g' src/index.html) | head -20 || true
                echo "  Injected <script> here usually means a Cloudflare feature was"
                echo "  re-enabled in the dashboard. The CSP refuses them, so they do"
                echo "  nothing except break this check and log an error for every visitor."
              else
                echo "::error::https://${host} never served this deployment (no response body)"
              fi
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      # The same check again, on the real origin: CORS names readthegame.co
      # separately from the preview hostnames, and only production proves it.
      - name: a visitor can actually read the data — on production
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs data-readable --site https://readthegame.co

      # The same check again, on the custom domain: the ZONE can inject into
      # production (it has, twice -- see the diff step) and never into *.pages.dev.
      - name: the live game raises no policy refusal — on production
        if: steps.site.outputs.changed == 'true'
        run: node tools/browser/run.mjs csp-refusal --site https://readthegame.co

      - name: summary
        if: steps.site.outputs.changed == 'true'
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "**https://readthegame.co**"
            echo ""
            for host in $PUBLIC_HOSTS; do echo "- https://${host}"; done
            echo ""
            echo "Immutable URL for this commit: ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Checked first as a preview: ${{ steps.preview.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
