# The only thing that catches "works on the author's machine".
#
# `npm run gates` passed locally on node 20 for days while failing on node 22,
# because `node --test test/` resolves a directory argument differently between
# versions -- and since gates is an && chain, the four downstream gates never
# ran at all. Every claim of "all gates pass" during that period was true only
# of one machine.
name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      # ⭐ FULL HISTORY, BECAUSE refcheck READS IT. `tools/refcheck.py` verifies
      # revision-pinned citations with `git show <rev>:<path>` — the form that
      # lets a dated design doc stay checkable after the code it describes has
      # moved. The default checkout is SHALLOW, so those revisions are not in the
      # clone and every historical citation failed with "no builders/build_main.py
      # at revision 29f4c30" on the first CI run after it shipped. Green locally,
      # red here, because full history is the thing a laptop has and a runner
      # does not.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # ⭐ PILLOW, FOR TWO TESTS AND ONE BUILDER. `builders/mugs.py` resizes the
      # headshots and `test/test_mugs.py` checks that the result is a 112px WebP
      # with its alpha intact. ⛔ WITHOUT THIS THOSE TWO ANNOUNCE A SKIP AND THE
      # GATE IS GREEN ON A CLAIM NOBODY CHECKED — Shape 10, a check that cannot
      # fail in the conditions you run it under. The other ten tests in that file
      # need no image library at all, deliberately, so a laptop without Pillow
      # still runs everything the TRAP is about.
      - name: pillow, so the headshot tests are not skipped
        run: python3 -m pip install --quiet --disable-pip-version-check 'pillow>=10,<13'
      # Runs on a clean checkout, so a stale generated file cannot mask a
      # broken builder: build reproducibility is part of the gate.
      - run: npm run gates
      - name: the working tree must be unchanged by a build
        run: git diff --exit-code
