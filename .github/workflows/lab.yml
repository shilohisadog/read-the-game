# THE LAB: prototypes of replay changes, at https://lab.read-the-game.pages.dev.
# Lives ONLY on the `lab` branch. Builds the site and deploys it as a Pages
# branch preview. Reads production data (R2 CORS allows *.read-the-game.pages.dev);
# writes nothing: no R2 credentials, no edition seal, no commit. Production
# deploys only from `main` (deploy.yml), and its own preview branch is `candidate`.
name: lab

on:
  push:
    branches: [lab]
  workflow_dispatch:

concurrency:
  group: lab
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: read-the-game
  WRANGLER: wrangler@4.120.0

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: build
        run: npm run build
      - name: mark it as the lab, and keep it out of search
        run: |
          printf 'User-agent: *\nDisallow: /\n' > src/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > src/_headers
          for f in src/*.html; do
            sed -i 's#<body\([^>]*\)>#<body\1><div style="position:fixed;bottom:6px;left:6px;z-index:99999;background:\#7c3aed;color:\#fff;font:700 11px/1 system-ui;padding:4px 7px;border-radius:5px;letter-spacing:.08em;pointer-events:none">LAB</div>#' "$f"
          done
      - name: deploy as the lab preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" pages deploy src --project-name "$PROJECT" \
            --branch lab --commit-dirty=true 2>&1 | tee lab.log
          echo "Lab: https://lab.read-the-game.pages.dev" >> "$GITHUB_STEP_SUMMARY"
