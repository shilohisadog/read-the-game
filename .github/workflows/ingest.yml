# The nightly ingest. Fetches a rolling window from the NHL and syncs it to R2.
#
# Design: docs/nightly-ingest.md. Runs here rather than in a Cloudflare Worker
# because the extraction produces every number on the site, and a Worker is code
# that is not in the thing being audited.
#
# THE WINDOW IS 14 DAYS, AND THE JOB CONVERGES RATHER THAN FIRES. A missed night
# is recovered by the next run with no operator action, so GitHub's scheduler
# being less reliable than Cloudflare's costs nothing. The window also exists for
# a reason independent of hosting: the league amends play-by-play after the fact,
# and a job that only ingests yesterday would enshrine the first version of every
# game forever.
#
# ON GITHUB DISABLING SCHEDULED WORKFLOWS AFTER 60 DAYS OF REPOSITORY INACTIVITY:
# there is deliberately no keepalive commit here. A robot committing to keep a
# cron alive is noise in a history that is meant to be readable, and it would be
# guarding the wrong thing. What actually catches a stalled pipeline is the
# `lastIngest` date rendered on the front page -- a stale date is visible to
# users and to us, with no monitoring service in existence. Refuse to hide the
# state and the monitoring falls out.
name: ingest

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC — after the latest North American games finish
  workflow_dispatch:
    inputs:
      end:
        description: 'Last date of the window (YYYY-MM-DD). Blank = today.'
        required: false
      days:
        description: 'Window length in days'
        default: '14'
        required: false
      delay:
        description: 'Seconds to wait after each request. Use ~0.3 for a season backfill.'
        default: '0'
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false   # never interrupt a run mid-sync

permissions:
  contents: read

env:
  BUCKET: readthegame
  WINDOW: ${{ inputs.days || '14' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The fetcher is gated like everything else. An ingest that runs with a
      # broken fetcher writes bad data into an archive we intend to keep
      # permanently, and object storage has no undo.
      - name: gates
        run: python3 -m unittest discover -s test -p 'test_*.py'

      # REHYDRATE THE POINTERS BEFORE FETCHING. fetch_nhl.py decides
      # unchanged-vs-amended by reading raw/{game}/latest.json, and a CI
      # checkout starts empty -- so without this every run would call every game
      # new and re-upload the whole archive nightly. Only the pointers are
      # pulled, never the raw feeds: latest.json is a few hundred bytes per game,
      # so a full season is under a megabyte, while the archive it describes is
      # hundreds of megabytes.
      - name: pull the state pointers from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p ingest
          aws s3 sync "s3://${BUCKET}/" ingest/ \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" \
            --exclude '*' --include '*/latest.json' --include 'index.json' \
            --include 'catalog.json' \
            --no-progress
          echo "rehydrated $(find ingest -name latest.json | wc -l) game pointers"
          # CATALOG.JSON IS PULLED BECAUSE THE MERGE HAS NOTHING TO MERGE INTO
          # WITHOUT IT. `_write_catalog` reads the previous catalog out of the
          # store and adds this run's verdicts to it -- correct code, and it
          # published an EMPTY catalog on its first live run because the store on
          # this runner had never been given the file. A run that judges nothing
          # then merges nothing into nothing and advertises an archive of zero
          # games, which is what a visitor's game page reads to find anything at
          # all. Fixing the merge without giving it its baseline fixed a narrower
          # claim than it announced. index.json is regenerated whole and does not
          # need this; the catalog is CUMULATIVE and does.

      # PROVE THE POINTERS RESOLVE, rather than believing them.
      #
      # A pointer names three content-addressed objects. Nothing here is
      # transactional, so a job killed mid-sync can leave a pointer whose bytes
      # are still queued -- and the convergence loop would then trust it forever:
      # re-fetch, hash, digests match, report `unchanged`, write nothing. The
      # hole would be invisible and permanent, because `unchanged` is the steady
      # state of a pipeline that is working.
      #
      # This rides on the rehydrate that already happened, so it costs one
      # listing and no per-object requests. A dangling pointer is dropped
      # locally, which makes that game read as new in the fetch below and
      # repairs itself on this same run. Nothing is ever deleted from R2.
      - name: every pointer must name bytes that are really there
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api list-objects-v2 --bucket "$BUCKET" \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" \
            --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | grep -v '^None$' | sed '/^$/d' > bucket-keys.txt || true
          echo "bucket holds $(wc -l < bucket-keys.txt) objects"
          python3 builders/fetch_nhl.py --audit bucket-keys.txt --out ingest | head -40

      - name: fetch the window
        id: fetch
        run: |
          END="${{ inputs.end }}"
          [ -n "$END" ] || END=$(date -u +%F)
          echo "window: ${WINDOW} days ending ${END}"
          # PIPESTATUS, not $?. After a pipeline `$?` is TEE's exit code, which
          # is always 0 -- so a halted or erroring fetch would report success and
          # the run would sync and pass. This exact mistake is logged twice in
          # this project's history against `| tail`; writing it a third time
          # while implementing the design that warns about it would be quite
          # something.
          set +e
          python3 builders/fetch_nhl.py --end "$END" --days "${WINDOW}" \
            --delay "${{ inputs.delay || '0' }}" --out ingest | tee report.json
          code=${PIPESTATUS[0]}
          set -e
          echo "fetch exited ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      # DERIVE WHAT WE JUST FETCHED, and nothing else.
      #
      # Only the games fetched or amended this run have raw bytes on this
      # runner -- the rehydrate above pulls POINTERS ONLY. Those are exactly the
      # games whose extracts are missing or stale, so the steady state costs one
      # pass over one night of hockey. Everything else reports `absent`, which is
      # not a fault: it is the shape of a partial view, and fetch_nhl's pointer
      # audit is what asks whether the BUCKET is missing anything.
      #
      # Re-deriving the whole archive after the vocabulary grows is a different
      # operation and lives in derive.yml, because it needs the raw and this
      # does not.
      #
      # The window is passed for REPORTING only: refusedInWindow is a window
      # figure and derivation has no window of its own.
      - name: derive the games we just fetched
        if: steps.fetch.outputs.code != '2'
        run: |
          END="${{ inputs.end }}"
          [ -n "$END" ] || END=$(date -u +%F)
          python3 builders/derive.py --out ingest --end "$END" --days "${WINDOW}"

      # Exit 2 is the vocabulary halt: the same unrecognised gameState appeared
      # in more than one game, which is a feed change rather than an oddity.
      # Nothing was fetched, so there is nothing to sync and the run stops here.
      - name: refuse to publish a run that halted
        if: steps.fetch.outputs.code == '2'
        run: |
          echo "::error::the run halted on a feed vocabulary change — nothing published"
          cat report.json
          exit 1

      # Exit 1 means some games failed to fetch. Those wrote nothing at all, so
      # the games that DID succeed are complete and correct and should be
      # published. The job still fails at the end so the failure is not silent.
      - name: sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # No --delete, ever. Raw feeds are content-addressed and immutable;
          # an amendment adds a version rather than replacing one, and deleting
          # would destroy the history the window exists to measure.
          #
          # THREE PASSES, STRICTLY ORDERED, BECAUSE NOTHING HERE IS
          # TRANSACTIONAL. A pointer must never name bytes the bucket does not
          # hold, and `index.json` must never advertise a game that cannot be
          # served. One sync gives no ordering between a game's raw objects and
          # its latest.json, so a job killed midway could publish the pointer
          # first -- and the convergence loop would then believe it forever.
          #
          # `set -e` is what makes this a guarantee rather than a hope: a pass
          # that fails stops the ones after it, so a pointer in the bucket
          # implies its bytes are in the bucket. Dying during pass 1 leaves
          # orphaned raw objects with no pointers, which is the harmless
          # direction -- the game reads as new next run and is simply rewritten.
          #
          # The filters discriminate by FILENAME. AWS CLI wildcards match across
          # '/', so `--include 'raw/*/*.json'` would also match the three-segment
          # content paths and defeat the whole point.
          sync() { aws s3 sync ingest/ "s3://${BUCKET}/" \
                     --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress "$@"; }

          # PROVE THE FILTERS PARTITION BEFORE TRUSTING THEM. The ordering above
          # is only a guarantee if every file lands in exactly one pass: a file
          # in no pass is silently never uploaded, and a raw object that leaked
          # into the pointer pass would break the very ordering this exists to
          # create. --dryrun answers with the real CLI's own wildcard semantics
          # rather than my reading of them.
          dry() { sync --dryrun "$@" | sed -n "s|.*to s3://${BUCKET}/||p" | sort; }
          dry --exclude 'index.json' --exclude 'catalog.json' --exclude '*latest.json' > p1.txt
          dry --exclude '*' --include '*latest.json'          > p2.txt
          dry                                                 > all.txt
          grep -vxE 'index\.json|catalog\.json' all.txt > expected.txt || true
          if [ -s p1.txt ] && [ -s p2.txt ] && [ -n "$(comm -12 p1.txt p2.txt)" ]; then
            echo "::error::a file is claimed by two passes — ordering is not guaranteed"
            comm -12 p1.txt p2.txt | head; exit 1
          fi
          if ! cmp -s <(sort -u p1.txt p2.txt) <(sort -u expected.txt); then
            echo "::error::the passes do not cover everything that needs uploading"
            diff <(sort -u p1.txt p2.txt) <(sort -u expected.txt) | head; exit 1
          fi
          n=$(wc -l < all.txt)
          if [ "$n" = 0 ]; then
            echo "  nothing to upload this run — the partition check is vacuous"
          else
            echo "  $n objects partition cleanly: $(wc -l < p1.txt) raw, $(wc -l < p2.txt) pointers, index"
          fi

          echo "1/3 raw feeds and extracts"
          sync --exclude 'index.json' --exclude 'catalog.json' --exclude '*latest.json'
          echo "2/3 pointers"
          sync --exclude '*' --include '*latest.json'
          # 3/3 THE DOCUMENTS THAT ADVERTISE. catalog.json names games a visitor
          # can open and index.json states what we hold, so both must land after
          # the extracts they point at -- the same rule that puts the pointer
          # after its bytes, one level up.
          echo "3/3 catalog and index"
          # `if`, not `[ -f ] &&`. Under `set -e` a failing test on the left of
          # && fails the whole step, so a run with nothing to publish -- a halt,
          # or a night with no hockey -- would report a broken sync.
          # THE CATALOG NEVER SHRINKS, so a smaller one is a bug and not a
          # verdict. Refusals stay listed and nothing is ever removed, so the
          # row count is monotonic by construction -- which makes this a real
          # invariant rather than a threshold tuned to today's numbers. It is
          # checked HERE, against the bucket, because that is the only place
          # both numbers exist: a runner whose baseline never arrived cannot
          # tell "first run" from "the file did not come down".
          if [ -f ingest/catalog.json ]; then
            aws s3 cp "s3://${BUCKET}/catalog.json" was-catalog.json \
              --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress || : > was-catalog.json
            python3 - <<'PY'
          import json, os, sys
          def rows(p):
              try:    return len(json.load(open(p))['games'])
              except Exception: return 0
          now, was = rows('ingest/catalog.json'), rows('was-catalog.json')
          print(f"  catalog {was} -> {now} rows")
          if now < was:
              sys.exit(f"::error::the catalog would LOSE {was - now} games "
                       f"({was} -> {now}); refusing to publish it")
          PY
          fi
          for f in catalog.json index.json; do
            if [ -f "ingest/$f" ]; then
              aws s3 cp "ingest/$f" "s3://${BUCKET}/$f" \
                --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress
            fi
          done
          echo "synced"

      # Syncing and assuming it landed is not verification -- the same lesson the
      # deploy gate learned. Read the index back out of the bucket and confirm it
      # is the one we just wrote.
      - name: read the index back from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ ! -f ingest/index.json ]; then
            echo "nothing new this run — no index written, so nothing to verify"
            exit 0
          fi
          aws s3 cp "s3://${BUCKET}/index.json" remote-index.json \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress
          if ! cmp -s remote-index.json ingest/index.json; then
            echo "::error::the index in R2 is not the index we just wrote"
            exit 1
          fi
          # ASSERT THE CONTRACT, do not print prose about it. The first version
          # of this step ended in an f-string quoting `lastIngest`, and when that
          # field was removed the step failed -- after cmp had already proved the
          # sync was byte-correct. A green pipeline reported red because of a
          # decoration, which is a false red, and false reds are how a working
          # gate gets ignored. Anything worth printing here is worth checking.
          python3 - <<'PY'
          import json, sys
          i = json.load(open('remote-index.json'))
          missing = [k for k in ('lastRun', 'games', 'coverage') if k not in i]
          if missing:
              sys.exit(f"::error::index is missing {missing}")
          c = i['coverage']
          held, err = c['heldInWindow'], c['erroredInWindow']
          refused = c['refusedInWindow']
          if c['finalInWindow'] != held + err + refused:
              sys.exit(f"::error::coverage ledger does not close: {c}")
          undated = [g['id'] for g in i['games'] if not g.get('date')]
          if undated:
              sys.exit(f"::error::games without a date, so dataThrough is unreliable: {undated[:5]}")
          print(f"  {len(i['games'])} games | dataThrough={i.get('dataThrough')} "
                f"| lastRun={i['lastRun']} | halted={bool(i.get('halted'))}")
          print(f"  ledger closes: {c['finalInWindow']} = {held} + {err} + {refused}")
          PY

      # CHECK WHAT A VISITOR GETS, NOT WHAT THE LEDGER SAYS.
      #
      # Every check above this one passed on the night the site went dark. The
      # ledger closed, the index round-tripped, the sync was byte-correct -- and
      # the catalog we published named zero games, so the game page had nothing
      # to open. The one check that would have caught it lived in the DEPLOY, and
      # deploy runs on push while the damage arrived on a schedule.
      #
      # So it runs unconditionally, over the public origin, and it asks the
      # question the visitor asks: is there a game I can watch. `if: always()`
      # because a run that failed earlier still leaves a live site behind it.
      - name: a visitor can still find a game
        if: always()
        run: |
          curl -sS --fail "https://data.readthegame.co/catalog.json?cb=${GITHUB_RUN_ID}" \
            -o live-catalog.json
          python3 - <<'PY'
          import json, sys, urllib.request
          c = json.load(open('live-catalog.json'))['games']
          watchable = [g for g in c if g.get('v')]
          print(f"  {len(c)} games listed, {len(watchable)} watchable")
          if not watchable:
              sys.exit("::error::the published catalog names no game a visitor can open")
          newest = max(watchable, key=lambda g: (g['d'], g['id']))
          url = f"https://data.readthegame.co/extract/{newest['id']}.json"
          with urllib.request.urlopen(url) as r:
              g = json.load(r)
          print(f"  landing game: {newest['a']} at {newest['h']} · {newest['d']} "
                f"· {len(g['events'])} events")
          PY

      - name: summary
        if: always()
        run: |
          {
            echo "### Ingest"
            echo ""
            if [ -f report.json ]; then
              echo '```json'
              cat report.json
              echo '```'
            else
              echo "The fetcher produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: fail the run if any game errored
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::error::fetch exited ${{ steps.fetch.outputs.code }} — see the report above"
          exit 1
