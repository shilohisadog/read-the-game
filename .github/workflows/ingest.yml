# The nightly ingest. Fetches a rolling window from the NHL and syncs it to R2.
#
# Design: docs/nightly-ingest.md. Runs here rather than in a Cloudflare Worker
# because the extraction produces every number on the site, and a Worker is code
# that is not in the thing being audited.
#
# THE WINDOW IS 14 DAYS, AND THE JOB CONVERGES RATHER THAN FIRES. A missed night
# is recovered by the next run with no operator action, so GitHub's scheduler
# being less reliable than Cloudflare's costs nothing. The window also exists for
# a reason independent of hosting: the league amends play-by-play after the fact,
# and a job that only ingests yesterday would enshrine the first version of every
# game forever.
#
# ON GITHUB DISABLING SCHEDULED WORKFLOWS AFTER 60 DAYS OF REPOSITORY INACTIVITY:
# there is deliberately no keepalive commit here. A robot committing to keep a
# cron alive is noise in a history that is meant to be readable, and it would be
# guarding the wrong thing. What actually catches a stalled pipeline is the
# `lastIngest` date rendered on the front page -- a stale date is visible to
# users and to us, with no monitoring service in existence. Refuse to hide the
# state and the monitoring falls out.
name: ingest

on:
  # ⚠️ THESE ARE THE TIMES WE ASK FOR, NOT THE TIMES IT RUNS. GitHub deprioritises
  # scheduled workflows and this one is late nearly every day; the measured spread,
  # the latest puck drop it has to clear and the deadline the three entries are
  # sized against all live in docs/front-door.md §6.1, which is the one place that
  # owns them. Do not restate any of it here — this file already had a sentence
  # drift away from its original (the halt step below, which named the wrong cause
  # for a year), and a second copy of a measurement is that defect waiting.
  #
  # ⭐ THREE ENTRIES BECAUSE THE JOB CONVERGES, WHICH IS THE CHEAPEST POSSIBLE
  # DEFENCE AGAINST A SCHEDULER WE DO NOT CONTROL. The window is 14 days and the
  # run is idempotent, so a second attempt that finds nothing new reports
  # `unchanged` and exits in about a minute. Only ONE of the three has to land
  # inside the window; the others cost almost nothing when it does. Kevin,
  # 2026-09-23, set the target this is sized for: last night's games ingested,
  # processed and on the site by 10:00 Eastern, daily.
  #
  # ⛔ AND NOT ON THE HOUR OR THE HALF HOUR. Those are the two slots every cron on
  # the platform is written to, and they are where the deprioritisation bites
  # hardest. The odd minutes are free and there is no reason to queue behind
  # everyone else.
  # ⭐⭐ AND SINCE 2026-09-24 THESE ARE THE FALLBACK, NOT THE PRIMARY.
  # `worker/trigger.js` is a Cloudflare cron that POSTs a `workflow_dispatch` to
  # this file, because a dispatch is not deprioritised and a schedule is -- and
  # because on 09-23 the scheduler did not fire here AT ALL, which is a different
  # failure from the lateness these three entries were sized against. They stay
  # exactly as they are: they are what keeps the site current on the day that
  # Worker's token expires, and its failure is silent by construction.
  # docs/front-door.md §6.1.3 owns that reasoning; do not restate it here.
  schedule:
    - cron: '23 7 * * *'
    - cron: '53 8 * * *'
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      end:
        description: 'Last date of the window (YYYY-MM-DD). Blank = today.'
        required: false
      days:
        description: 'Window length in days'
        default: '14'
        required: false
      delay:
        description: 'Seconds to wait after each request. Use ~0.3 for a season backfill.'
        default: '0'
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false   # never interrupt a run mid-sync

permissions:
  contents: read

env:
  BUCKET: readthegame
  # ⭐ AT THE JOB, NOT AT A STEP, AND THAT IS THE WHOLE REPAIR.
  # These were added to the PULL step on 2026-08-30 and the very next run died
  # on the PUSH step with the identical 503 -- the fix was applied to one of two
  # surfaces while its own commit message claimed both. Step-level env is an
  # enumeration, and an enumeration is a list somebody has to remember to extend.
  # At the job every aws call in it is covered, including the ones not written yet.
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: '10'
  WINDOW: ${{ inputs.days || '14' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # ⭐ NODE, PINNED, BECAUSE THE SLATE IS MEASURED IN IT. `measure.mjs`
      # imports the same reducers the browser runs rather than restating them in
      # Python (docs/architecture.md §2), so the nightly crossed the language
      # boundary the day it started measuring. Pinned to the same version
      # derive.yml uses: a runner's default node is whatever the image ships
      # this month, and "it worked yesterday" is not a version policy.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The fetcher is gated like everything else. An ingest that runs with a
      # broken fetcher writes bad data into an archive we intend to keep
      # permanently, and object storage has no undo.
      - name: gates
        run: python3 -m unittest discover -s test -p 'test_*.py'

      # REHYDRATE THE POINTERS BEFORE FETCHING. fetch_nhl.py decides
      # unchanged-vs-amended by reading raw/{game}/latest.json, and a CI
      # checkout starts empty -- so without this every run would call every game
      # new and re-upload the whole archive nightly. Only the pointers are
      # pulled, never the raw feeds: latest.json is a few hundred bytes per game,
      # so a full season is under a megabyte, while the archive it describes is
      # hundreds of megabytes.
      - name: pull the state pointers from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p ingest
          # ⭐ THROTTLING IS THE EXPECTED CONDITION AT THIS SIZE, NOT AN ERROR.
          # 2026-08-30: two consecutive derives died pulling the archive, on
          # THREE DIFFERENT OBJECTS -- 1 failure in 18,216 downloads, then 2 --
          # each a 503 reading "Reduce your rate of simultaneous reads on the
          # same object". `aws s3 sync` exits 1 if ANY single transfer fails, so
          # one unlucky object out of eighteen thousand took the whole run down
          # before derive.py had started.
          #
          # ⚠️ AND IT IS NOT THE HOT OBJECT, WHICH I ASSUMED FIRST AND CHECKED.
          # Content addressing does create one: a single shifts blob is fetched
          # 202 times because 202 games share its hash. None of the three
          # failures was that object -- they were singletons -- so this is
          # ordinary throttling under the default 10-way concurrency and R2's
          # message is its generic 503 text.
          #
          # THREE MEASURES, WEAKEST FIRST: adaptive mode makes the client back
          # off instead of hammering, more attempts survive a slow bucket, and
          # fewer simultaneous requests provoke less of it. The retry around the
          # whole sync is the backstop, and it is cheap because sync is
          # INCREMENTAL -- a second pass re-fetches only what the first missed.
          aws configure set default.s3.max_concurrent_requests 4
          ok=
          for attempt in 1 2 3; do
            if aws s3 sync "s3://${BUCKET}/" ingest/ \
                --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" \
                --exclude '*' --include '*/latest.json' --include 'index.json' \
                --include 'catalog.json' \
                --no-progress; then ok=1; break; fi
            echo "::warning::pull attempt $attempt hit a transient R2 error; retrying"
            sleep $(( attempt * 20 ))
          done
          if [ -z "$ok" ]; then
            echo "::error::the archive could not be pulled in three attempts"
            exit 1
          fi
          echo "rehydrated $(find ingest -name latest.json | wc -l) game pointers"
          # CATALOG.JSON IS PULLED BECAUSE THE MERGE HAS NOTHING TO MERGE INTO
          # WITHOUT IT. `_write_catalog` reads the previous catalog out of the
          # store and adds this run's verdicts to it -- correct code, and it
          # published an EMPTY catalog on its first live run because the store on
          # this runner had never been given the file. A run that judges nothing
          # then merges nothing into nothing and advertises an archive of zero
          # games, which is what a visitor's game page reads to find anything at
          # all. Fixing the merge without giving it its baseline fixed a narrower
          # claim than it announced. index.json is regenerated whole and does not
          # need this; the catalog is CUMULATIVE and does.

      # PROVE THE POINTERS RESOLVE, rather than believing them.
      #
      # A pointer names three content-addressed objects. Nothing here is
      # transactional, so a job killed mid-sync can leave a pointer whose bytes
      # are still queued -- and the convergence loop would then trust it forever:
      # re-fetch, hash, digests match, report `unchanged`, write nothing. The
      # hole would be invisible and permanent, because `unchanged` is the steady
      # state of a pipeline that is working.
      #
      # This rides on the rehydrate that already happened, so it costs one
      # listing and no per-object requests. A dangling pointer is dropped
      # locally, which makes that game read as new in the fetch below and
      # repairs itself on this same run. Nothing is ever deleted from R2.
      - name: every pointer must name bytes that are really there
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api list-objects-v2 --bucket "$BUCKET" \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" \
            --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | grep -v '^None$' | sed '/^$/d' > bucket-keys.txt || true
          echo "bucket holds $(wc -l < bucket-keys.txt) objects"
          python3 builders/fetch_nhl.py --audit bucket-keys.txt --out ingest | head -40

      - name: fetch the window
        id: fetch
        run: |
          END="${{ inputs.end }}"
          [ -n "$END" ] || END=$(date -u +%F)
          echo "window: ${WINDOW} days ending ${END}"
          # PIPESTATUS, not $?. After a pipeline `$?` is TEE's exit code, which
          # is always 0 -- so a halted or erroring fetch would report success and
          # the run would sync and pass. This exact mistake is logged twice in
          # this project's history against `| tail`; writing it a third time
          # while implementing the design that warns about it would be quite
          # something.
          set +e
          python3 builders/fetch_nhl.py --end "$END" --days "${WINDOW}" \
            --delay "${{ inputs.delay || '0' }}" --out ingest | tee report.json
          code=${PIPESTATUS[0]}
          set -e
          echo "fetch exited ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      # DERIVE WHAT WE JUST FETCHED, and nothing else.
      #
      # Only the games fetched or amended this run have raw bytes on this
      # runner -- the rehydrate above pulls POINTERS ONLY. Those are exactly the
      # games whose extracts are missing or stale, so the steady state costs one
      # pass over one night of hockey. Everything else reports `absent`, which is
      # not a fault: it is the shape of a partial view, and fetch_nhl's pointer
      # audit is what asks whether the BUCKET is missing anything.
      #
      # Re-deriving the whole archive after the vocabulary grows is a different
      # operation and lives in derive.yml, because it needs the raw and this
      # does not.
      #
      # The window is passed for REPORTING only: refusedInWindow is a window
      # figure and derivation has no window of its own.
      #
      # ⛔⛔⛔ THE EXIT CODE IS READ, NOT INHERITED — 2026-09-25. This step used to
      # let derive.py's code fail the job, and derive.py exits non-zero on a
      # NAMING gap over an archive it has already written correctly. So three new
      # penalty descriptors stopped the sync for 31 hours and the site sat at
      # `dataThrough 2026-09-23` — a display label withholding real hockey, which
      # is the mistake `data/vocabulary-seen.json` and derive.py's own docstring
      # both name and neither could prevent, because both were comments.
      #
      # 2 means everything is written and safe to publish and a label needs a
      # human. Anything else means the output cannot be trusted, and the `exit`
      # below halts the job before the sync exactly as before. The alarm for 2
      # fires AFTER the sync — see `a label the feed invented`, and
      # test/workflows.test.js asserts that ordering.
      #
      # ⚠️ `set +e` AROUND ONE COMMAND, NOT THE STEP. The default shell is
      # `bash -e {0}`; capturing `$?` from a command that is allowed to fail
      # needs the flag off for that command and back on immediately, or a later
      # failure in this step passes silently — which is the `git add &&` defect
      # in its shell spelling.
      - name: derive the games we just fetched
        id: derive
        if: steps.fetch.outputs.code != '2'
        run: |
          END="${{ inputs.end }}"
          [ -n "$END" ] || END=$(date -u +%F)
          set +e
          python3 builders/derive.py --out ingest --end "$END" --days "${WINDOW}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then
            echo "::error::derive exited $code — the output cannot be trusted, so nothing is published"
            exit "$code"
          fi
          # ⚠️ AN `if`, NOT `[ … ] && echo …`. Under `set -e` an AND-list whose
          # test fails is exempt from the exit rule by a clause most people have
          # to look up — and this is the step that exists because a shell
          # swallowed a status quietly. A construct I have to reason about twice
          # does not belong in it.
          if [ "$code" = 2 ]; then
            echo "  derive: published, and a label needs a name (exit 2)"
          fi
          exit 0

      # ⭐ THE SLATE — last night's games, measured by the SAME reducers the
      # browser runs, so a daily surface can state a count without a second
      # implementation of what an attempt is (docs/front-door.md §6.1).
      #
      # ⛔ `--slate` IS NOT OPTIONAL AND IS NOT STYLE. Without it this command
      # writes measures.json and teams.json into `ingest/`, and the first sync
      # pass below excludes only index.json, catalog.json and *latest.json — so
      # a nightly run would publish an EIGHT-GAME measures.json over the
      # archive-wide one, and the home page, which reads `moreAttemptsLost` out
      # of that document, would begin saying "Across 8 games in this archive".
      # `archiveIsWhole()` refuses that now, so the mistake is a red run rather
      # than a wrong front page — but the flag is the thing that makes it right.
      #
      # `shell: bash` FOR `-o pipefail`, which the default `bash -e {0}` does not
      # carry. There is no pipe here today; derive.yml had one, and its step
      # reported success for six days over a ReferenceError because of exactly
      # that. Naming the shell costs nothing and removes the trap.
      #
      # AN EMPTY WINDOW WRITES AN EMPTY DOCUMENT rather than skipping: a run that
      # found no hockey and left last night's games published would advertise
      # them forever, which is schedule.json's argument one file over.
      - name: measure the slate
        if: steps.fetch.outputs.code != '2'
        shell: bash
        run: node builders/measure.mjs --out ingest --slate

      # Exit 2 is a HALT. Nothing was fetched, so there is nothing to sync and
      # the run stops here.
      #
      # ⛔⛔ AND THIS STEP NAMED THE WRONG CAUSE FOR A YEAR, WHICH COST A DAY.
      # It read "the run halted on a feed vocabulary change", and the comment
      # above it described the OLD correlation halt — the same unrecognised
      # gameState in more than one game — which `fetch_nhl.py` replaced. On
      # 2026-09-19 the run halted because no game in the window was final (seven
      # preseason openers, all `FUT` at 14:15 UTC) and reported itself as a
      # vocabulary change. The wrong label was believed, written into
      # docs/status.md and into memory, and the real cause went unexamined for a
      # day while a separate, genuine vocabulary halt on the 20th seemed to
      # confirm it.
      #
      # ⭐ SO THE STEP PRINTS THE HALT'S OWN REASON. `fetch_nhl.py` already
      # composes a sentence naming what it saw and why it stopped; restating it
      # here is a second copy free to drift from the first, and it did.
      - name: refuse to publish a run that halted
        if: steps.fetch.outputs.code == '2'
        run: |
          why=$(python3 -c 'import json,sys; print(json.load(open("report.json")).get("haltReason") or "")' 2>/dev/null)
          echo "::error::the run halted and published nothing: ${why:-report.json carries no haltReason}"
          cat report.json
          exit 1

      # ⭐ WHAT THIS RUN IS ABOUT TO PUBLISH IS SOUND — CHECKED BEFORE THE SYNC.
      # The index's own contract and the archive ledger used to be asserted only
      # after the sync, against the bucket, so a ledger that did not close was
      # already public when it failed. Both read files this run wrote into ingest/
      # (docs/test-program.md §5: validate before, read back after). The read-back
      # steps below the sync still prove the bucket holds these exact bytes.
      - name: what this run will publish is sound — before the sync
        if: steps.fetch.outputs.code != '2' && hashFiles('ingest/index.json') != ''
        run: |
          python3 builders/ledger.py ingest/index.json ingest/catalog.json
          python3 - <<'PY'
          import json, sys
          i = json.load(open('ingest/index.json'))
          missing = [k for k in ('lastRun', 'games', 'coverage') if k not in i]
          if missing:
              sys.exit(f"::error::index is missing {missing}")
          c = i['coverage']
          held, err = c['heldInWindow'], c['erroredInWindow']
          refused = c['refusedInWindow']
          if c['finalInWindow'] != held + err + refused:
              sys.exit(f"::error::coverage ledger does not close: {c}")
          undated = [g['id'] for g in i['games'] if not g.get('date')]
          if undated:
              sys.exit(f"::error::games without a date, so dataThrough is unreliable: {undated[:5]}")
          print(f"  {len(i['games'])} games | dataThrough={i.get('dataThrough')} "
                f"| lastRun={i['lastRun']} | halted={bool(i.get('halted'))}")
          print(f"  ledger closes: {c['finalInWindow']} = {held} + {err} + {refused}")

          # ⭐ THE FIXTURES CARRY THE LEAGUE'S OWN NIGHT, OR WE DO NOT PUBLISH.
          # The front door names a whole night from `date`, and without it the page
          # DEGRADES to naming one game -- correctly, quietly, and indefinitely.
          # CHENG: nothing would distinguish "the pipeline has not run yet" from
          # "the pipeline is broken", and the observed failure mode on this site is
          # that nobody notices. So the run refuses rather than reports.
          # Vacuous when `upcoming` is empty, which is five months of the year.
          import os
          sp = 'ingest/schedule.json'
          if os.path.exists(sp):
              up = json.load(open(sp)).get('upcoming') or []
              undatedf = [g['id'] for g in up if not g.get('date')]
              if undatedf:
                  sys.exit(f"::error::fixtures without the league's date, so the front "
                           f"door cannot name a night: {undatedf[:5]}")
              nights = sorted({g['date'] for g in up})
              print(f"  {len(up)} fixtures over {len(nights)} nights"
                    + (f" ({nights[0]}..{nights[-1]})" if nights else ""))
              # ⚠️ AND THE WEEK-AHEAD REQUEST FAILING LOOKS EXACTLY LIKE SUCCESS:
              # every fixture is today's, every field is present, every check above
              # passes. One night is what that looks like, so it is said out loud.
              if len(nights) == 1:
                  print(f"::warning::every fixture is on {nights[0]} — the forward "
                        f"request may not be reaching past today")
          PY

      # Exit 1 means some games failed to fetch. Those wrote nothing at all, so
      # the games that DID succeed are complete and correct and should be
      # published. The job still fails at the end so the failure is not silent.
      - name: sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # No --delete, ever. Raw feeds are content-addressed and immutable;
          # an amendment adds a version rather than replacing one, and deleting
          # would destroy the history the window exists to measure.
          #
          # THREE PASSES, STRICTLY ORDERED, BECAUSE NOTHING HERE IS
          # TRANSACTIONAL. A pointer must never name bytes the bucket does not
          # hold, and `index.json` must never advertise a game that cannot be
          # served. One sync gives no ordering between a game's raw objects and
          # its latest.json, so a job killed midway could publish the pointer
          # first -- and the convergence loop would then believe it forever.
          #
          # `set -e` is what makes this a guarantee rather than a hope: a pass
          # that fails stops the ones after it, so a pointer in the bucket
          # implies its bytes are in the bucket. Dying during pass 1 leaves
          # orphaned raw objects with no pointers, which is the harmless
          # direction -- the game reads as new next run and is simply rewritten.
          #
          # The filters discriminate by FILENAME. AWS CLI wildcards match across
          # '/', so `--include 'raw/*/*.json'` would also match the three-segment
          # content paths and defeat the whole point.
          #
          # --cache-control ON EVERY UPLOAD, INCLUDING THE RAW FEEDS NOBODY
          # FETCHES. Measured 2026-08-21: with no Cache-Control at all, a
          # browser applies HEURISTIC freshness -- 10% of the object's age --
          # and answers from its own store WITHOUT asking us. Five of five data
          # files did (1ms against a 59-72ms forced-network control). So a
          # visitor could be shown a number we had already corrected, and
          # `derive.yml` rewrote the whole archive three times in one week.
          #
          # `no-cache` is not `no-store`: the response is still stored, still
          # served without re-sending the body, and revalidated before EVERY
          # use. It is the only setting that is both cheap and never stale, and
          # it is the only one that requires us to choose no number.
          #
          # It goes on the raw objects too. They are content-addressed and could
          # honestly be `immutable`, but no browser ever fetches them -- so the
          # header is inert there, while a fourth filter dimension over a
          # three-pass partition we had to PROVE partitions is a real hazard.
          # A header that is merely conservative on an object nobody reads costs
          # nothing; getting the filters wrong costs the ordering guarantee.
          # ⭐ THE RETRY LIVES IN THE HELPER, SO ALL THREE ORDERED PASSES GET IT
          # and none can be forgotten -- which is exactly how the push side was
          # missed when the pull side was hardened.
          # ⚠️ IT STILL RETURNS NON-ZERO WHEN IT GIVES UP. `set -e` stopping a
          # failed pass is what makes "a pointer in the bucket implies its bytes
          # are in the bucket" a guarantee rather than a hope, so `[ -n "$ok" ]`
          # is the function's last command on purpose.
          # ⚠️ AND THE WARNING GOES TO STDERR, because `dry()` parses this
          # function's STDOUT -- a retry notice on stdout would enter the
          # partition proof as a filename.
          aws configure set default.s3.max_concurrent_requests 4
          sync() {
            local attempt ok=
            for attempt in 1 2 3; do
              if aws s3 sync ingest/ "s3://${BUCKET}/" \
                   --cache-control no-cache \
                   --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress "$@"; then
                ok=1; break
              fi
              echo "::warning::sync attempt $attempt hit a transient R2 error; retrying" >&2
              sleep $(( attempt * 20 ))
            done
            [ -n "$ok" ]
          }

          # PROVE THE FILTERS PARTITION BEFORE TRUSTING THEM. The ordering above
          # is only a guarantee if every file lands in exactly one pass: a file
          # in no pass is silently never uploaded, and a raw object that leaked
          # into the pointer pass would break the very ordering this exists to
          # create. --dryrun answers with the real CLI's own wildcard semantics
          # rather than my reading of them.
          dry() { sync --dryrun "$@" | sed -n "s|.*to s3://${BUCKET}/||p" | sort; }
          dry --exclude 'index.json' --exclude 'catalog.json' --exclude 'recent.json' --exclude '*latest.json' > p1.txt
          dry --exclude '*' --include '*latest.json'          > p2.txt
          dry                                                 > all.txt
          grep -vxE 'index\.json|catalog\.json|recent\.json' all.txt > expected.txt || true
          if [ -s p1.txt ] && [ -s p2.txt ] && [ -n "$(comm -12 p1.txt p2.txt)" ]; then
            echo "::error::a file is claimed by two passes — ordering is not guaranteed"
            comm -12 p1.txt p2.txt | head; exit 1
          fi
          if ! cmp -s <(sort -u p1.txt p2.txt) <(sort -u expected.txt); then
            echo "::error::the passes do not cover everything that needs uploading"
            diff <(sort -u p1.txt p2.txt) <(sort -u expected.txt) | head; exit 1
          fi
          n=$(wc -l < all.txt)
          if [ "$n" = 0 ]; then
            echo "  nothing to upload this run — the partition check is vacuous"
          else
            echo "  $n objects partition cleanly: $(wc -l < p1.txt) raw, $(wc -l < p2.txt) pointers, index"
          fi

          echo "1/3 raw feeds and extracts"
          sync --exclude 'index.json' --exclude 'catalog.json' --exclude 'recent.json' --exclude '*latest.json'
          echo "2/3 pointers"
          sync --exclude '*' --include '*latest.json'
          # 3/3 THE DOCUMENTS THAT ADVERTISE. catalog.json names games a visitor
          # can open and index.json states what we hold, so both must land after
          # the extracts they point at -- the same rule that puts the pointer
          # after its bytes, one level up.
          # ⭐ recent.json JOINED THIS PASS, NOT THE FIRST ONE. It names game ids a
          # reader clicks through to, so it lands AFTER the extracts it points
          # at — the same rule as catalog.json directly below, and the same rule
          # that puts a pointer after its bytes one level up. In pass 1 it would
          # be uploaded alongside the very extracts it advertises, and a visitor
          # arriving in that window gets a door to a game that is not there yet.
          echo "3/3 catalog, index and the slate"
          # `if`, not `[ -f ] &&`. Under `set -e` a failing test on the left of
          # && fails the whole step, so a run with nothing to publish -- a halt,
          # or a night with no hockey -- would report a broken sync.
          # THE CATALOG NEVER SHRINKS, so a smaller one is a bug and not a
          # verdict. Refusals stay listed and nothing is ever removed, so the
          # row count is monotonic by construction -- which makes this a real
          # invariant rather than a threshold tuned to today's numbers. It is
          # checked HERE, against the bucket, because that is the only place
          # both numbers exist: a runner whose baseline never arrived cannot
          # tell "first run" from "the file did not come down".
          if [ -f ingest/catalog.json ]; then
            aws s3 cp "s3://${BUCKET}/catalog.json" was-catalog.json \
              --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress || : > was-catalog.json
            python3 - <<'PY'
          import json, os, sys
          def rows(p):
              try:    return len(json.load(open(p))['games'])
              except Exception: return 0
          now, was = rows('ingest/catalog.json'), rows('was-catalog.json')
          print(f"  catalog {was} -> {now} rows")
          if now < was:
              sys.exit(f"::error::the catalog would LOSE {was - now} games "
                       f"({was} -> {now}); refusing to publish it")
          PY
          fi
          for f in catalog.json index.json recent.json; do
            if [ -f "ingest/$f" ]; then
              aws s3 cp "ingest/$f" "s3://${BUCKET}/$f" \
                --cache-control no-cache \
                --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress
            fi
          done
          echo "synced"

      # Syncing and assuming it landed is not verification -- the same lesson the
      # deploy gate learned. Read the index back out of the bucket and confirm it
      # is the one we just wrote.
      - name: read the index back from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ ! -f ingest/index.json ]; then
            echo "nothing new this run — no index written, so nothing to verify"
            exit 0
          fi
          aws s3 cp "s3://${BUCKET}/index.json" remote-index.json \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress
          if ! cmp -s remote-index.json ingest/index.json; then
            echo "::error::the index in R2 is not the index we just wrote"
            exit 1
          fi
          # Its CONTRACT (the coverage ledger closes, every game dated) is asserted
          # on ingest/index.json before the sync; byte identity carries it here.
          echo "  the index in R2 is byte-identical to the one this run wrote and checked"
          # ASSERT THE CONTRACT, do not print prose about it. The first version
          # of this step ended in an f-string quoting `lastIngest`, and when that
          # field was removed the step failed -- after cmp had already proved the
          # sync was byte-correct. A green pipeline reported red because of a
          # decoration, which is a false red, and false reds are how a working
          # gate gets ignored. Anything worth printing here is worth checking.

      # ⭐ AND THE ARCHIVE LEDGER ANSWERS TO THE CATALOG -- ON THE NIGHTLY,
      # WHICH IS THE RUN THAT BROKE.
      #
      # D8's figures were written HERE and checked only in derive.yml, which is
      # WEEKLY. The run that published `published: 0, absent: 4553` over a whole
      # archive was the one run nothing looked at, for months. A gate that skips
      # the case that breaks is a gate written against the cases that existed --
      # the deploy filename exemption, the night list that labelled a group only
      # when it was not alone, the front door's hand-written competition list.
      # This project has now paid for that shape four times.
      #
      # THE DENOMINATOR HERE IS THE WHOLE CATALOG, on a run that derives one
      # night of hockey or none at all. That is the property the old check
      # lacked, and asking for it is the lesson the outage cost us.
      - name: the archive ledger answers to the catalog
        if: hashFiles('ingest/index.json') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # index.json is already down as remote-index.json and PROVEN
          # byte-identical to what we wrote; the catalog is the second half of
          # the pair and has to come from the bucket for the same reason -- a
          # local file is what we meant to publish, not what a visitor gets.
          aws s3 cp "s3://${BUCKET}/catalog.json" remote-catalog.json \
            --endpoint-url "${{ secrets.S3_API_ENDPOINT }}" --no-progress
          python3 builders/ledger.py remote-index.json remote-catalog.json

      # CHECK WHAT A VISITOR GETS, NOT WHAT THE LEDGER SAYS.
      #
      # Every check above this one passed on the night the site went dark. The
      # ledger closed, the index round-tripped, the sync was byte-correct -- and
      # the catalog we published named zero games, so the game page had nothing
      # to open. The one check that would have caught it lived in the DEPLOY, and
      # deploy runs on push while the damage arrived on a schedule.
      #
      # So it runs unconditionally, over the public origin, and it asks the
      # question the visitor asks: is there a game I can watch. `if: always()`
      # because a run that failed earlier still leaves a live site behind it.
      # ONE CLIENT, AND IT IDENTIFIES ITSELF. This step used to curl the catalog
      # and then urlopen the extract, which put TWO HTTP clients in one check --
      # and on 2026-08-12 the edge started answering 403 to the default
      # `Python-urllib/3.14` User-Agent while serving curl a 200. Nothing about
      # the archive had changed: the object was there, 87,358 bytes, and every
      # browser could read it. The run went red anyway, and the message it
      # printed was about a game a visitor could not open.
      #
      # `fetch_nhl.py` had sent an explicit User-Agent since the day it was
      # written. The rule existed in the fetcher and was not carried into a gate
      # written months later, which is how it comes back.
      - name: a visitor can still find a game
        if: always()
        env:
          UA: read-the-game ingest gate (+https://readthegame.co)
        run: |
          get() {  # url, outfile -> prints the HTTP status, always exits 0
            curl -sS -A "$UA" -o "$2" -w '%{http_code}' "$1" || echo 000
          }
          code=$(get "https://data.readthegame.co/catalog.json?cb=${GITHUB_RUN_ID}" \
                     live-catalog.json)
          # A REFUSAL IS NOT A FINDING ABOUT THE ARCHIVE, and must not be reported
          # as one. 403 says the edge would not talk to US; it says nothing about
          # whether a visitor can watch a game, and the two need different words
          # or the next person spends an hour looking at the data.
          if [ "$code" = 403 ]; then
            echo "::error::the edge refused THIS CHECK (403) — that is a fact about"
            echo "  our own request, not about the archive. Check the Cloudflare bot"
            echo "  rules for data.readthegame.co before touching the pipeline."
            exit 1
          fi
          [ "$code" = 200 ] || { echo "::error::catalog.json answered HTTP $code"; exit 1; }

          id=$(python3 - <<'PY'
          import json, sys
          c = json.load(open('live-catalog.json'))['games']
          w = [g for g in c if g.get('v')]
          print(f"  {len(c)} games listed, {len(w)} watchable", file=sys.stderr)
          if not w:
              sys.exit("::error::the published catalog names no game a visitor can open")
          n = max(w, key=lambda g: (g['d'], g['id']))
          print(f"  landing game: {n['a']} at {n['h']} · {n['d']}", file=sys.stderr)
          print(n['id'])
          PY
          ) || exit 1
          [ -n "$id" ] || { echo "::error::no landing game was chosen"; exit 1; }

          code=$(get "https://data.readthegame.co/extract/$id.json" landing.json)
          if [ "$code" = 403 ]; then
            echo "::error::the edge refused this check's request for extract/$id.json"
            echo "  (403) — our request, not the archive. See the note above."
            exit 1
          fi
          [ "$code" = 200 ] || {
            echo "::error::the catalog names game $id and the archive answered HTTP $code"
            echo "  for it — a visitor landing on that game would get nothing"
            exit 1; }
          python3 - "$id" <<'PY'
          import json, sys
          g = json.load(open('landing.json'))
          # 200 AND EMPTY IS STILL BROKEN. The object existing is not the claim;
          # the claim is that a visitor gets a game to watch.
          if not g.get('events'):
              sys.exit(f"::error::extract/{sys.argv[1]}.json served 200 with no events")
          print(f"  it opens: {len(g['events'])} events")
          PY

      - name: summary
        if: always()
        run: |
          {
            echo "### Ingest"
            echo ""
            if [ -f report.json ]; then
              echo '```json'
              cat report.json
              echo '```'
            else
              echo "The fetcher produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ⭐⭐⭐ AFTER THE SYNC, AND THE POSITION IS THE WHOLE FIX. derive.py's naming
      # alarms fire over an archive that is already written and already public by
      # the time this runs, so the run goes red and the reader still gets the
      # games. The report above names the value; `src/lib/penalties.js` and
      # `builders/extract.py::KNOWN_PENALTIES` are where a penalty descriptor
      # goes once it has been read, and `data/vocabulary-seen.json` is where a
      # value goes that we have decided to render raw.
      #
      # ⛔ MOVING THIS STEP ABOVE THE SYNC RESTORES THE DEFECT IT WAS WRITTEN FOR,
      # silently and with every test green. test/workflows.test.js compares the
      # two positions.
      - name: a label the feed invented, over an archive that published
        if: steps.derive.outputs.code == '2'
        run: |
          echo "::error::the feed used a name we have never seen — the archive is "\
               "published and current, and something on the page will render raw "\
               "until it is given words. See the derive report above."
          exit 1

      - name: fail the run if any game errored
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::error::fetch exited ${{ steps.fetch.outputs.code }} — see the report above"
          exit 1
