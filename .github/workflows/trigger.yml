# Deploy the ingest trigger Worker.
#
# WHAT IT IS AND WHY IT IS SEPARATE FROM deploy.yml. `deploy.yml` publishes the
# SITE and gates itself on the whole site being right. This ships one Worker that
# posts a `workflow_dispatch` to `ingest.yml` on a Cloudflare cron, so that the
# nightly's start time is ours instead of GitHub's queue's. It changes about
# never, so it runs only when its own files move. Why the Worker is allowed to
# exist at all is in worker/trigger.js; the measurements that size its crons are
# in docs/front-door.md §6.1.0, which owns them.
#
# ⛔ THE SECRET IS NOT SET FROM HERE, ON PURPOSE. `GITHUB_TOKEN` is a
# fine-grained PAT with `actions: write` on this repository and nothing else, put
# in place once by hand. Routing it through GitHub Actions would mean storing a
# GitHub credential in GitHub in order to hand it to Cloudflare, which is a copy
# of a key in a place that does not need one.
#
# ⚠️ AND IT IS SET IN THE CLOUDFLARE DASHBOARD, NOT WITH WRANGLER. The obvious
# instruction -- `wrangler secret put GITHUB_TOKEN` -- CANNOT BE RUN HERE:
# wrangler 4.x refuses to start on Node below 22 and the development machine runs
# 20, pinned, because that is what the suite is tested against. deploy.yml has
# said so at the top of the file since it was written, in the paragraph about why
# the site is published from CI and not from a laptop, and this workflow shipped
# with the impossible instruction in it anyway. The route that works needs no
# local runtime at all: Workers & Pages -> readthegame-ingest-trigger -> Settings
# -> Variables and Secrets -> add a SECRET named exactly GITHUB_TOKEN. The Worker
# has to exist first, which is what the deploy step below does.
#
# The last step checks the secret is THERE without ever seeing it, because the
# failure it prevents is the quiet one: a Worker that deploys green, 401s every
# morning, and is covered for by the fallback crons in ingest.yml while nothing
# says so.
name: trigger

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/trigger.yml'
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.120.0   # pinned, as in deploy.yml: npx resolving "latest" is not a build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # refcheck reads history; `npm run gates` runs it

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The same rule deploy.yml states: the check that guards a deploy has to be
      # the deploy's own. test/trigger.test.js is the part that matters here --
      # it is what notices if ingest.yml ever stops accepting a dispatch.
      - name: gates
        run: npm run gates

      # ⭐⭐ NAME THE REFUSAL BEFORE WRANGLER SWALLOWS IT. `wrangler deploy`
      # answers a permissions problem with "No access to the specified resource"
      # and the URL it tried, and that one sentence covers THREE causes with
      # three different fixes: the token is not valid at all, the token is valid
      # but carries no Workers Scripts permission, or the permission was added to
      # a different account from the one CLOUDFLARE_ACCOUNT_ID names. Guessing
      # between them costs a round trip through somebody else's dashboard each
      # time. These two calls separate them, and neither prints anything derived
      # from the token.
      - name: what the Cloudflare token can actually do
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          v=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "$AUTH" \
              https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "token verify        : HTTP $v  status=$(jq -r '.result.status // "-"' /tmp/verify.json)  $(jq -c '[.errors[]?.message]' /tmp/verify.json)"

          w=$(curl -s -o /tmp/scripts.json -w '%{http_code}' -H "$AUTH" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          echo "workers scripts list: HTTP $w  $(jq -c '[.errors[]?.message]' /tmp/scripts.json)  scripts=$(jq -r '[.result[]?.id] | join(",")' /tmp/scripts.json)"

          if [ "$v" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not a valid token (HTTP $v) — expired, revoked, or the secret holds something that is not a token. Nothing about Workers permissions can be concluded until this is 200."
            exit 1
          fi
          if [ "$w" != "200" ]; then
            echo "::error::the token is valid but cannot list Workers scripts on account $CLOUDFLARE_ACCOUNT_ID (HTTP $w). Either it has no 'Account > Workers Scripts > Edit' — which is an ACCOUNT permission, not a zone one — or that permission was added to a DIFFERENT account from the one this id names."
            exit 1
          fi
          echo "the token can see this account's Workers. Whatever the deploy does next is not a permissions problem at this level."

      - name: deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y $WRANGLER deploy --config worker/wrangler.toml

      # ⭐ THE STEP THAT STOPS THIS SHIPPING DEAD. `wrangler secret list` prints
      # the NAMES of the secrets bound to the Worker and never their values, so
      # this can assert the token is in place without the token being anywhere
      # near this runner. Without it, a first deploy onto an account where the
      # secret was never put succeeds, the cron 401s at 06:47 the next morning,
      # ingest.yml's own crons quietly cover for it, and the only symptom is that
      # the thing we built to remove the tail did not remove it.
      - name: the Worker has a token bound to it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y $WRANGLER secret list --config worker/wrangler.toml | tee /tmp/secrets.txt
          grep -q 'GITHUB_TOKEN' /tmp/secrets.txt || {
            echo "::error::the Worker is deployed with no GITHUB_TOKEN bound, so every dispatch will 401. Add it in the Cloudflare dashboard: Workers & Pages > readthegame-ingest-trigger > Settings > Variables and Secrets > add a SECRET named GITHUB_TOKEN. (Not with wrangler: it needs Node 22 and the dev machine is pinned to 20.)"
            exit 1
          }
