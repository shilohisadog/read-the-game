# Deploy the ingest trigger Worker.
#
# WHAT IT IS AND WHY IT IS SEPARATE FROM deploy.yml. `deploy.yml` publishes the
# SITE and gates itself on the whole site being right. This ships one Worker that
# posts a `workflow_dispatch` to `ingest.yml` on a Cloudflare cron, so that the
# nightly's start time is ours instead of GitHub's queue's. It changes about
# never, so it runs only when its own files move. Why the Worker is allowed to
# exist at all is in worker/trigger.js; the measurements that size its crons are
# in docs/front-door.md §6.1.0, which owns them.
#
# ⛔ THE SECRET IS NOT SET FROM HERE, ON PURPOSE. `GITHUB_TOKEN` is a
# fine-grained PAT with `actions: write` on this repository and nothing else, put
# in place once by hand:
#
#     npx wrangler@4.120.0 secret put GITHUB_TOKEN --config worker/wrangler.toml
#
# Routing it through GitHub Actions would mean storing a GitHub credential in
# GitHub in order to hand it to Cloudflare, which is a copy of a key in a place
# that does not need one. The last step below checks it is THERE without ever
# seeing it, because the failure it prevents is the quiet one: a Worker that
# deploys green, 401s every morning, and is covered for by the fallback crons in
# ingest.yml while nothing says so.
name: trigger

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/trigger.yml'
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.120.0   # pinned, as in deploy.yml: npx resolving "latest" is not a build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # refcheck reads history; `npm run gates` runs it

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # The same rule deploy.yml states: the check that guards a deploy has to be
      # the deploy's own. test/trigger.test.js is the part that matters here --
      # it is what notices if ingest.yml ever stops accepting a dispatch.
      - name: gates
        run: npm run gates

      - name: deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y $WRANGLER deploy --config worker/wrangler.toml

      # ⭐ THE STEP THAT STOPS THIS SHIPPING DEAD. `wrangler secret list` prints
      # the NAMES of the secrets bound to the Worker and never their values, so
      # this can assert the token is in place without the token being anywhere
      # near this runner. Without it, a first deploy onto an account where the
      # secret was never put succeeds, the cron 401s at 06:47 the next morning,
      # ingest.yml's own crons quietly cover for it, and the only symptom is that
      # the thing we built to remove the tail did not remove it.
      - name: the Worker has a token bound to it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y $WRANGLER secret list --config worker/wrangler.toml | tee /tmp/secrets.txt
          grep -q 'GITHUB_TOKEN' /tmp/secrets.txt || {
            echo "::error::the Worker is deployed with no GITHUB_TOKEN bound, so every dispatch will 401. Run: npx $WRANGLER secret put GITHUB_TOKEN --config worker/wrangler.toml"
            exit 1
          }
